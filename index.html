// ONE guarded status setter used by BOTH the checkbox (humans) and the AI's set_task_status tool:
// same lock-order + evidence-required rules + audit feed for everyone. Returns {ok} or {ok:false,reason}.
function applyTaskStatus(l,t,nx){
  if(taskLocked(l,t)) return {ok:false,reason:"🔒 Locked — "+lockReason(l,t)};
  if(nx==="x"&&EVID.has(t.code)&&!(t.links||[]).length){ const nmv=v3T(V3MAP[t.code]||{en:t.t,zh:t.t});
    return {ok:false,reason:LANG==="zh"?("📎 需附證明連結 —— 標記「"+nmv+"」完成前，請先在這一步附上交付物連結（Task Playbook）"):("📎 Evidence required — attach a link before marking “"+nmv+"” done (Task Playbook)")}; }
  t.st=nx;
  if(nx==="x")logEvent("milestone","✓ completed · "+l.name+" — "+t.t,{card:l.slug});
  else if(nx==="b")logEvent("blocked","⛔ blocked · "+l.name+" — "+t.t,{card:l.slug});
  return {ok:true};
}
/* ---- Design-freeze guard: once "Design freeze" is ticked, editing the 概念 (Concept) / 開發 (Build) steps is risky → ask first ---- */
function designFreezeStage(){ return Object.keys(GATES).find(s=>(GATES[s]||[]).some(c=>c.t==="Design freeze"))||"Production"; }
function isDesignFrozen(l){ const t=l&&(l.tasks||[]).find(x=>x.t==="Design freeze"); return !!(t&&t.st==="x"); }
// the design phases that lock once design freezes = every stage BEFORE the one Design freeze sits in (Concept + Build)
function isFrozenDesignStage(stage){ const fi=STAGES.indexOf(designFreezeStage()), si=STAGES.indexOf(stage); return si>=0&&fi>=0&&si<fi; }
// returns true to PROCEED, false to ABORT the edit (user declined the post-freeze change)
async function confirmFrozenStepEdit(l,t){
  if(!l||!t||!isDesignFrozen(l)||!isFrozenDesignStage(t.stage)) return true;
  const zh={Concept:"概念",Build:"開發"}[t.stage]||t.stage;
  const msg=LANG==="zh"
    ? "設計已凍結 ❄️\n\n「"+t.t+"」屬於"+zh+"階段。設計凍結後再變更概念／開發步驟（含改狀態、加連結、加備註等）有風險，可能牽動已定案的規格與下游作業。\n\n仍要繼續嗎？"
    : "Design is frozen ❄️\n\n“"+t.t+"” is a "+t.stage+" step. Changing concept/development steps after design freeze (status, links, notes…) is risky — it can affect locked specs and downstream work.\n\nContinue anyway?";
  return await uiConfirm(msg);
}
// resolve a launch task by (slug,i) and run the freeze guard — returns true to PROCEED, false to abort. Campaign (__camp) tasks pass through.
async function frozenStepGuard(slug,i){ const l=(typeof L==="function")?L(slug):null; return confirmFrozenStepEdit(l, l&&l.tasks&&l.tasks[i]); }
function cycle(slug,i,el){ stepStatus(slug,i,1,el); }      // left-click advances the status loop
function cycleBack(slug,i,el){ stepStatus(slug,i,-1,el); }  // right-click steps it back (so you don't have to wrap all the way around)
/* Reopen guard: leaving a "done" step invalidates every completed step that depends on it (via the req DAG).
   Warn (design-language confirm) + return the downstream done steps for the caller to reset together; shake + abort on cancel. */
async function guardReopen(l,t,el){
  const deps=(t&&t.st==="x")?v3DoneDeps(l,t):[];
  if(!deps.length) return {ok:true,reset:[]};
  const zh=LANG==="zh", nm=x=>(x.code?x.code+" ":"")+flowTaskName(x);
  const msg=zh
    ? "重新開啟「"+flowTaskName(t)+"」\n\n後面還有 "+deps.length+" 個已完成步驟會一併退回「未完成」：\n\n"+deps.map(nm).join("、")+"\n\n要繼續嗎？"
    : "Reopen “"+flowTaskName(t)+"”\n\nThis resets "+deps.length+" completed downstream step(s):\n\n"+deps.map(nm).join(", ")+"\n\nContinue?";
  const ok=await uiConfirm(msg,true,{okLabel:zh?("退回 "+deps.length+" 步"):("Reopen "+deps.length+" steps")});
  if(!ok){ bvShake(el); return {ok:false,reset:[]}; }
  return {ok:true,reset:deps};
}
async function stepStatus(slug,i,dir,el){ // status loop: todo → in progress → done → blocked → todo (dir<0 walks it backward)
  const l=L(slug), t=l.tasks[i];
  if(taskLocked(l,t)){ bvShake(el); toast("🔒 "+lockReason(l,t)); return; }   // locked → can't act out of order: nudge + say why (no silent dead click)
  if(!await confirmFrozenStepEdit(l,t)) return;   // post-design-freeze guard for 概念/開發 steps
  const nx=(dir<0?{p:"o",x:"p",b:"x",o:"b"}:{o:"p",p:"x",x:"b",b:"o"})[t.st]; // backward map is the exact inverse of forward
  if(t.st==="x"&&nx!=="x"){                        // leaving "done" → its completed downstream steps become invalid; warn + cascade-reopen them
    const g=await guardReopen(l,t,el); if(!g.ok) return;
    g.reset.forEach(d=>{d.st="o"; if(d.doneAt)delete d.doneAt;});
    if(g.reset.length) toast(LANG==="zh"?("↩ 已一併退回後續 "+g.reset.length+" 個步驟"):("↩ Reset "+g.reset.length+" downstream step(s)"));
  }
  const r=applyTaskStatus(l,t,nx); if(!r.ok){toast(r.reason);return;}
  if(nx==="x"){const lane=flowOf(l)[t.d]; const ii=lane?lane.findIndex(n=>n.t===t.t):-1;
    if(ii>=0){const key=t.d+"|"+lane[ii].l; const others=[...new Set(routeSteps(key,t.d,ii,l).map(p=>p[0]))].filter(x=>x!==t.d);
      if(others.length){S.route={key,d:t.d,i:ii};
        toast(LANG==="zh"?"✨ 完成 → 這個交接涉及:"+others.join(", ")+" —— 流程圖上已標示路線":"✨ Done → this hand-off involves: "+others.join(", ")+" — route highlighted on the flow chart");}}}
  if(nx==="p"&&!t.startAt)t.startAt=today; if(nx==="x")t.doneAt=today; else if(t.doneAt)delete t.doneAt;
  v3Advance(l);   // no manual push — the phase auto-derives from what's still open
  render();
}
function lockReason(l,t){ return v3LockText(l,t)||(LANG==="zh"?"先完成前置步驟":"complete the previous step first"); }
function approve(slug,i){
  const l=L(slug), t=l.tasks[i];
  if(S.role!=="ceo"){toast("◆ gates can only be approved by Ben (CEO)");return;}
  if(taskLocked(l,t)){toast("🔒 "+lockReason(l,t));return;}
  t.st="x"; t.doneAt=today; if(t.decision)delete t.decision;   // approving supersedes an earlier ✗
  l.checkins.unshift({d:today,a:"Ben",txt:`Approved “${t.t}” via Slack. (Mock: committed as [x] + audit line.)`});
  if(l.decisionRequested) delete l.decisionRequested[t.code];
  log("✓ Ben approved ◆ on "+l.name); v3Advance(l);
  toast("✓ Approved — committed to repo, Slack message updated"); render();
}
// ◆ 的 No 有落點：狀態留在「未完成」（否決不是完成），另記 decision 讓看板分得出「還沒看」與「已駁回、正在重做」
function gateReject(slug,i){
  const l=L(slug), t=l&&l.tasks[i]; if(!t)return;
  if(S.role!=="ceo"){toast("◆ gates can only be decided by Ben (CEO)");return;}
  if(t.st==="x"){toast(LANG==="zh"?"已核准的關卡請先撤銷核准":"revoke the approval first");return;}
  t.decision={v:"no",at:today}; t.st="o"; if(t.doneAt)delete t.doneAt;
  l.checkins.unshift({d:today,a:"Ben",txt:`Rejected “${t.t}” — sent back for rework.`});
  logEvent("blocked","✗ 否決 · "+l.name+" — "+t.code+" "+t.t,{card:l.slug});
  log("✗ Ben rejected ◆ on "+l.name); v3Advance(l);
  toast(LANG==="zh"?"✗ 已否決 — 修正後可再送":"✗ Rejected — fix it and resubmit"); save(); render();
}
function unapprove(slug,i){ // revert a Ben ◆ sign-off — kept Ben-only so the gate is fully his to control
  const l=L(slug), t=l.tasks[i];
  if(S.role!=="ceo"){toast("◆ gates can only be changed by Ben (CEO)");return;}
  t.st="o"; if(t.doneAt)delete t.doneAt; if(t.decision)delete t.decision;
  l.checkins.unshift({d:today,a:"Ben",txt:`Reverted approval on “${t.t}”.`});
  log("↩ Ben reverted ◆ on "+l.name); v3Advance(l);
  toast("↩ Approval reverted"); render();
}

function htmlUtf8(h){h=h||""; return /<meta[^>]+charset/i.test(h)?h:('<meta charset="utf-8">\n'+h);} // force UTF-8 so ★ · — etc. don't mojibake
function openCodeFull(html,url){
  if(url){window.open(url,"_blank");return;}
  const doc=htmlUtf8(html);
  const w=window.open("","_blank");
  if(w){ try{ w.document.open(); w.document.write(doc); w.document.close(); return; }catch(e){} }
  try{const b=new Blob([doc],{type:"text/html;charset=utf-8"}); window.open(URL.createObjectURL(b),"_blank");}catch(e){}
}
function codeModal({title,label,html,url,onSave,readOnly}){
  const old=document.getElementById("codeModal"); if(old)old.remove();
  const ov=document.createElement("div"); ov.className="cmodal"; ov.id="codeModal";
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.innerHTML=readOnly
   ?`<div class="cmbox"><div class="cmhead"><b>${url?"🔗":"&lt;/&gt;"} ${esc(label||"Attachment")}</b>
       <button class="cmtab on" id="cmTabP">Preview</button><button class="cmtab" id="cmTabS">Source</button>
       <button class="btn ghost" id="cmFull" style="padding:4px 10px" title="open the full page in a new browser tab">⛶ Full page</button>
       <button class="lnkb" style="font-size:16px" onclick="document.getElementById('codeModal').remove()">✕</button></div>
      <div class="cmbody" id="cmView"></div></div>`
   :`<div class="cmbox"><div class="cmhead"><b>${esc(title)}</b>
       <button class="lnkb" style="font-size:16px" onclick="document.getElementById('codeModal').remove()">✕</button></div>
      <div class="cmbody">
        <div class="frow" style="margin-bottom:8px"><label>Label</label><input type="text" id="cmLabel" value="${esc(label||"")}" placeholder="e.g. Email template, Claude page…" style="flex:1"></div>
        <textarea id="cmCode" placeholder="Paste HTML code here — it renders as a live preview for everyone on the board.">${esc(html||"")}</textarea>
        <div class="frow" style="margin-top:8px"><label>or Link</label><input type="text" id="cmUrl" value="${esc(url||"")}" placeholder="…or paste a link (Claude Code / hosted page URL) to embed instead of code" style="flex:1"></div>
      </div>
      <div class="cmfoot"><button class="btn ghost" onclick="document.getElementById('codeModal').remove()">Cancel</button>
        <button class="btn" id="cmSave">Save</button></div></div>`;
  document.body.appendChild(ov);
  if(readOnly){
    const view=ov.querySelector("#cmView"), tp=ov.querySelector("#cmTabP"), ts=ov.querySelector("#cmTabS");
    const showP=()=>{tp.classList.add("on");ts.classList.remove("on");const f=document.createElement("iframe");
      f.setAttribute("sandbox",url?"allow-scripts allow-forms allow-popups allow-same-origin":"allow-scripts allow-forms allow-popups");
      if(url)f.src=url; else f.srcdoc=htmlUtf8(html); view.innerHTML=""; view.appendChild(f);};
    const showS=()=>{ts.classList.add("on");tp.classList.remove("on");view.innerHTML=url?`<pre><a class="lnk" href="${esc(url)}" target="_blank">🔗 ${esc(url)}</a></pre>`:`<pre>${esc(html||"")}</pre>`;};
    ov.querySelector("#cmFull").onclick=()=>openCodeFull(html,url);
    tp.onclick=showP; ts.onclick=showS; showP();
  }else{
    ov.querySelector("#cmSave").onclick=()=>{const code=ov.querySelector("#cmCode").value, u=ov.querySelector("#cmUrl").value.trim();
      const nm=ov.querySelector("#cmLabel").value.trim()||(u&&!code.trim()?"Link":"HTML");
      if(code.trim()){onSave(nm,{h:code});}
      else if(u){onSave(nm,{u});}
      else {toast("Paste HTML code or a link first");return;}
      ov.remove();};
  }
}

async function push(slug){
  const l=L(slug);
  if(!allMet(l)){toast("🔒 Locked — not all exit criteria are met");return;}
  if(!canPushRole(l)){toast(`Only the DRI (${l.dri}), a mandatory department head, or Ben can push`);return;}
  const i=STAGES.indexOf(l.stage);
  if(i>=STAGES.length-1){l.complete=true;}else{l.stage=STAGES[i+1];}
  const who=S.role==="ceo"?"Ben":S.dept+" (head)";
  l.checkins.unshift({d:today,a:who,txt:`Pushed to ${l.complete?"Complete":l.stage}.${l.complete?"":" Next up: "+mandatory(l).join(", ")+" — their stage begins."}`});
  log("🚀 "+l.name+" pushed to "+(l.complete?"Complete":l.stage)+" by "+who); boom();
  if(!l.complete){const r=await uiPrompt(`Pre-mortem (optional): biggest risk entering ${l.stage}?`);
    if(r){(l.risks=l.risks||[]).push({t:r,owner:l.dri,sc:5,trigger:"—"}); log("⚠️ Pre-mortem risk logged on "+l.name);}}
  toast("🚀 Pushed — next-stage departments alerted in Slack"); render();
}

function renameDept(o,n){ n=n.trim(); if(!n||o===n)return;
  TEAM.find(t=>t.name===o).name=n;
  LAUNCHES.forEach(l=>{l.tasks.forEach(t=>{if(t.d===o)t.d=n;}); if(l.dri===o)l.dri=n;});
  CAMPAIGNS.forEach(c=>c.tasks.forEach(t=>{if(t.d===o)t.d=n;}));
  Object.values(GATES).forEach(cs=>cs.forEach(c=>{if(c.d===o)c.d=n;}));
  if(FLOW[o]){FLOW[n]=FLOW[o]; if(o!==n)delete FLOW[o];}
  Object.keys(XROUTES).forEach(k=>{XROUTES[k]=XROUTES[k].map(([dd,ll])=>[dd===o?n:dd,ll]);
    if(k.startsWith(o+"|")){XROUTES[n+k.slice(o.length)]=XROUTES[k]; delete XROUTES[k];}});
  Object.keys(TPLOV).forEach(k=>{const v=TPLOV[k]; if(v.d===o)v.d=n; if(v.who)v.who=v.who.map(d=>d===o?n:d);});
  if(S.dept===o)S.dept=n; toast(`Department renamed ${o} → ${n} everywhere`);
}

/* 負責人名單編輯 —— 名字是流程的識別字（V3 的 o 欄位、TPLOV 覆寫、指派欄都用名字對人），所以改名要一路帶過去 */
function peopleEdit(i,f,v){ const p=PEOPLE[i]; if(!p)return; if(f==="name"){renamePerson(p.name,v);} else p[f]=v; save(); render(); }
function ownerSteps(name){ return V3ALL.filter(n=>v3Owners(v3Own(n)).includes(name)); }   // 這個人負責的步驟（兩個模板都算）
function renamePerson(old,nw){ nw=(nw||"").trim();
  if(!nw||old===nw){render();return;}
  if(PEOPLE.some(p=>p.name===nw)){ toast(LANG==="zh"?("已有同名負責人："+nw):("A person named "+nw+" already exists")); render(); return; }
  const me=PEOPLE.find(p=>p.name===old); if(me)me.name=nw;
  // V3 是程式碼側的模板、不能改寫，所以改名寫成 TPLOV 的負責人覆寫（會隨快照持久化）
  V3ALL.forEach(n=>{ const parts=v3Owners(v3Own(n)); if(parts.includes(old)) tplOvSet(n.c,{o:parts.map(s=>s===old?nw:s).join(" + ")}); });
  log(`👤 Owner renamed · ${old} → ${nw}`); toast(LANG==="zh"?("負責人已改名 "+old+" → "+nw):("Owner renamed "+old+" → "+nw));
}
function addPerson(){ PEOPLE.push({name:"New person",dept:(ALLDEPTS()[0]||""),emails:""}); save(); render(); }
function delPerson(i){ const p=PEOPLE[i]; if(!p)return; const used=ownerSteps(p.name);
  if(used.length){ toast(LANG==="zh"?("無法移除 "+p.name+" — 還負責 "+used.length+" 個步驟"):("Cannot remove "+p.name+" — still owns "+used.length+" step(s)")); return; }
  PEOPLE.splice(i,1); save(); render(); }
// 設定頁：改某一步的負責人（寫進 TPLOV，v3Own 讀得到 —— 只改 GATES 會被下一次 v3Rederive 蓋回去）
function setStepOwner(code,owner){ const n=V3MAP[code]; if(!n)return; owner=(owner||"").trim();
  if(owner===v3Own(n))return;
  tplOvSet(code,{o:owner||n.o});
  log(`👤 Owner · ${n.en} → ${v3Own(n)}`); save(); render(); toast(LANG==="zh"?"負責人已更新":"Owner updated"); }
function delDept(i){ const d=TEAM[i].name;
  const used=LAUNCHES.some(l=>l.dri===d||l.tasks.some(t=>t.d===d))||Object.values(GATES).some(cs=>cs.some(c=>c.d===d));

const linkChips=(task,slug,i)=>(task.links||[]).map((k,li)=>`<span class="lnkg"><a class="lnk" href="${k.u}" target="_blank" title="${esc(k.u)}">🔗 ${esc(k.n)}</a><button class="lnkb" title="edit link" onclick="event.stopPropagation();editLink('${slug}',${i},${li})">✎</button><button class="lnkb" title="remove link" onclick="event.stopPropagation();removeLink('${slug}',${i},${li})">✕</button></span>`).join("")+codeChips(task,slug,i)+`<button class="addlnk" onclick="event.stopPropagation();addLink('${slug}',${i})">+ link</button><button class="addlnk" title="Create a Google Sheet under hello@blackvoyage.com (anyone-with-link can edit)" onclick="event.stopPropagation();createDriveDoc('${slug}',${i},'sheet')">📊 Sheet</button><button class="addlnk" title="Create a Google Doc under hello@blackvoyage.com (anyone-with-link can edit)" onclick="event.stopPropagation();createDriveDoc('${slug}',${i},'doc')">📝 Doc</button><button class="addlnk" title="Paste HTML code OR a link (Claude Code / hosted page) — preview, view source, or open the full page" onclick="event.stopPropagation();addCode('${slug}',${i})">&lt;/&gt; Code/Link</button>`;
/* ---- Step ownership model: each workflow step has ONE responsible department (the GATES owner s.d) plus optional collaborator departments. s.who stores [owner, ...collaborators] (back-compatible with the old multi-select). Shared across every product and configured once in Settings → Workflow template; the launch detail reads it live and offers a lightweight inline ＋ to add a collaborator. ---- */
function stepSlot(t){ return (GATES[t.stage]||[]).find(x=>x.t===t.t)||null; }
function stepHasDRI(t){ return !!stepSlot(t); }
function stepResp(t){ const s=stepSlot(t); return (s&&s.d)||t.d||""; }
function stepCollabs(t){ const s=stepSlot(t); if(!s)return []; const who=Array.isArray(s.who)?s.who:(s.who?[String(s.who)]:[]); return who.filter(d=>d&&d!==s.d); }
function setStepWho(s,collabs){ const clean=[...new Set((collabs||[]).filter(d=>d&&d!==s.d))]; if(clean.length) s.who=[s.d,...clean]; else delete s.who; if(s.code) tplOvSet(s.code,{who:clean}); }
// inline collaborator toggle from a launch task row (edits the shared template)
// 列上的「＋ 邀部門協助」選單（collabAddMenu/toggleCollab）已於 2026-08-12 移除（使用者裁決：不需要）。
// 協作者仍可在 設定 → Workflow 模板 編（tplCollab/setStepWho），列上只讀顯示 collabChips。
// ＋ on a task row's responsibility cluster: pull another department in as a collaborator so they know to weigh in
// template page: set the single responsible department for a step (propagates to every launch's task copy + campaigns)
// 寫進 TPLOV（會被快照帶走）而不是只改 GATES —— 只改 GATES 的話，下一次 v3Rederive/v3SyncTasks 就用 V3 的
// n.dept 蓋回去，使用者看到成功 toast、重新整理後編輯全部消失（連流程圖車道與熱力圖歸屬一起還原）。
function setStepResp(stage,taskName,dept){ const s=(GATES[stage]||[]).find(x=>x.t===taskName); if(!s||!dept||s.d===dept)return; const old=s.d;
  const collabs=(Array.isArray(s.who)?s.who:[]).filter(d=>d&&d!==s.d&&d!==dept);
  tplOvSet(s.code,{d:dept,who:collabs});
  v3Rederive(); LAUNCHES.forEach(v3SyncTasks);                                   // 重建車道／關卡／每張卡的 t.d，覆寫層在 v3Dept() 裡生效
  CAMPAIGNS.forEach(c=>(c.tasks||[]).forEach(t=>{ if(t.t===taskName)t.d=dept; })); // campaign 任務是自由格式，仍照標題對齊
  log(`🧭 Responsible · ${taskName} → ${dept} (was ${old})`); save(); render(); toast("Responsible department updated"); }
// template page: toggle a collaborator on a step
function tplCollab(stage,taskName,dept){ const s=(GATES[stage]||[]).find(x=>x.t===taskName); if(!s||!dept)return; const cur=(Array.isArray(s.who)?s.who:[]).filter(d=>d&&d!==s.d); const next=cur.includes(dept)?cur.filter(d=>d!==dept):cur.concat(dept); setStepWho(s,next); log(`👥 ${taskName} collaborators → ${next.join(", ")||"(none)"}`); save(); render(); }
/* chart↔checklist sync: a gate task's display NAME and sort ORDER come from its OWNING flow-chart node
   (the node in the task's own lane that links to it via `t`), so the by-stage list is a faithful mirror of
   the flow chart above — same wording, same sequence. Falls back to any linking node, then the raw title.
   `ord` = the node's flat position across all lanes (FLOW key order, then array order) → the flow sequence. */
// ORDER = the chart's department-lane sequence: walk lanes left→right (FLOW key order), each lane top→bottom.
// This keeps each stage's primary/DRI lane (e.g. Product in 生產) together and first — matching the process spine —
// rather than pixel-Y interleaving (which would scatter a long lane's later steps below short lanes' early steps).
function flowMetaFor(taskTitle,ownerDept){
  let k=0, owner=null, fallback=null;
  for(const FL of [FLOW,FLOWU]) for(const d of Object.keys(FL)){ const lane=FL[d]; if(!Array.isArray(lane)){continue;}   // titles are unique across the two templates — search both worlds, ord stays per-template-consistent
    for(const n of lane){ if(n&&n.t===taskTitle){ if(d===ownerDept&&!owner)owner={label:n.l,ord:k}; if(!fallback)fallback={label:n.l,ord:k}; } k++; } }
  return owner||fallback;
}
const flowTaskName=t=>{ const m=flowMetaFor(t.t,t.d); return m?flowTL(m.label):t.t; };   // what the by-stage row shows (mirrors the chart node)
const flowTaskOrd=t=>{ const m=flowMetaFor(t.t,t.d); return m?m.ord:1e9; };                 // sort key = flow-chart sequence
function gateControl(l,t,i,lk){ // Ben ◆ decision gate → a prominent button (like the advance button), not a tick-box, because Ben is the decision-maker
  if(lk) return `<button type="button" class="gatebtn locked" disabled title="locked — ${esc(lockReason(l,t))}" aria-label="Ben decision — locked, ${esc(lockReason(l,t))}">🔒</button>`;
  if(t.st==="x") return `<button type="button" class="gatebtn done" title="Ben approved this gate — click to revert" aria-label="Ben approved this gate — click to revert" onclick="unapprove('${l.slug}',${i})">✓ Approved</button>`;
  const zh=LANG==="zh";
  const rej=(t.decision&&t.decision.v==="no")?`<span class="gaterej" title="${zh?"Ben 已否決（"+fmt(t.decision.at)+"）— 修正後可再送":"rejected by Ben ("+fmt(t.decision.at)+") — fix and resubmit"}">✗ ${zh?"已否決":"rejected"}</span> `:"";
  return rej+`<button type="button" class="gatebtn ready" title="Ben's decision — approve to unblock the next stage" aria-label="Ben decision — approve" onclick="approve('${l.slug}',${i})">◆ Approve</button> <button type="button" class="gatebtn rej" title="${zh?"否決 — 退回重做（狀態留在未完成）":"reject — send back for rework"}" aria-label="Ben decision — reject" onclick="gateReject('${l.slug}',${i})">✕</button>`;
}
function taskRow(l,t,extra,ro,noexp){   // noexp（個人視角用）：不給展開箭頭、列不可點開詳情 —— 詳情去產品卡看
  const i=l.tasks.indexOf(t); const key=l.slug+":"+i; const open=noexp?false:S.open[key];
  const lk=taskLocked(l,t);
  const resp=stepResp(t), collabs=stepCollabs(t);
  const collabChips=collabs.map(d=>`<span class="o-collab" style="color:${DCOLOR(d)}" title="Collaborator — ${esc(d)}">${esc(d)}</span>`).join("");
  const vn=t.code&&V3MAP[t.code];   // V3 node behind this row (for the code chip, owner, manual-day control, sample date)
  const owner=vn?v3Own(vn):"";
  // 列上印的是「負責人」，部門收進 hover —— 部門名回答不了「我該找誰」，而每個步驟都掛得到一個真人。
  // 沒有負責人的步驟（自由格式的 campaign 任務）才退回部門。
  const lead=extra
    ? `<span class="o-stage" title="${esc(extra)}">${esc(extra)}</span>`
    : owner
      ? `<span class="o-resp o-hasowner" tabindex="0" style="color:${v3OColor(owner)};--oc:${DCOLOR(resp)}" data-owner="${esc((LANG==="zh"?"部門 · ":"Dept · ")+resp)}"><!--notx-->${esc(owner)}<!--/notx--></span>`
      : `<span class="o-resp" style="color:${DCOLOR(resp)}" title="Responsible dept — ${esc(resp)}">${esc(resp)}</span>`;
  const meta=`<span class="o ometa">${lead}${collabChips?`<span class="o-collabs">${collabChips}</span>`:""}</span>`;   // days moved into the detail panel (預設天數 row) — no longer on the outer row
  // a locked row (incl. Ben ◆ gates) gets a ▾ details expander so the "why it's locked" text lives in the panel, not inline
  const exp=`<button class="exp" onclick="toggle('${key}')" title="${open?(LANG==="zh"?"收合":"collapse"):(LANG==="zh"?"展開全部":"expand")}" aria-label="${open?"collapse":"expand"}">${open?"▴":"▾"}</button>`;
  const ctrls=t.gate?"":`${lk?"":renderLinkMenu(t,l.slug,i)}${noexp?"":exp}`;   // Ben ◆ gates carry no expand panel — the decision button says it all
  // the step's output/explanation now lives in the ▾ details panel (taskDetail), keeping the row short; a shot-list total shows for MS3a/b
  const shotChip=(vn&&vn.shots&&!extra&&v3ShotTotal(t)>0)?`<span class="ghostnote" title="${LANG==="zh"?"素材需求合計":"asset shot-list total"}">${vn.shots==="video"?"🎬":"📸"} ${v3ShotTotal(t)}</span>`:"";
  // 預計大貨樣日 moved INTO the detail panel (taskDetail's 應完成日 block) — no more duplicate outer strip
  const _hasPanel=open&&!t.gate;                                  // the detail panel is only rendered when open (non-gate)
  let _tpNew=""; if(_hasPanel){ if(!PANELSEEN.has(key)){PANELSEEN.add(key);_tpNew=" tp-in";} } else PANELSEEN.delete(key);  // first open → play reveal once; closed → forget so a reopen replays
  return `<div id="task-${l.slug}-${i}" class="taskwrap${_tpNew}" style="border-radius:2px"><div class="row${t.gate?" gaterow":""}" style="${(t.gate||noexp)?"":"cursor:pointer;"}${lk?"opacity:.38;filter:grayscale(.6)":""}"${(t.gate||noexp)?"":` onclick="rowToggle(event,'${key}')"`}>
   ${t.gate?gateControl(l,t,i,lk):`<button type="button" class="st ${lk?"":t.st}" ${lk?'aria-disabled="true"':""} aria-label="${lk?"locked — "+esc(lockReason(l,t)):"status: "+stWord(t.st)+" — left-click to advance, right-click to step back"}" title="${lk?"locked — "+esc(lockReason(l,t)):"left-click: advance · right-click: step back"}" onclick="cycle('${l.slug}',${i},this)" oncontextmenu="cycleBack('${l.slug}',${i},this);return false">${lk?"🔒":stIcon[t.st]}</button>`}
   <span>${vn?`<span class="v3code"><!--notx-->${esc(t.code)}<!--/notx--></span> `:""}${esc(flowTaskName(t))}${t.gate?' <span style="color:var(--purple)">◆</span>':""}${vn&&vn.days==null&&t.days==null&&t.st!=="x"&&!vn.ongoing?`<span class="daysmiss" title="${LANG==="zh"?"此步驟天數尚未填寫":"this step still needs a day estimate"}">⏱ ${LANG==="zh"?"天數未填":"days unset"}</span>`:""}
    ${EVID.has(t.code)&&!lk&&!(t.links||[]).length?`<span class="urg" style="background:#13262e;color:#67e8f9" title="${LANG==="zh"?"標記完成前必須附上證明連結":"a link must be attached before this can be checked"}">📎 ${LANG==="zh"?"待附證明":"evidence"}</span>`:""}
    ${shotChip}${ctrls}</span>
   ${meta}</div>
   ${open&&!t.gate?taskDetail(l,t,i,ro,vn,lk):""}</div>`;
}
function taskPanel(l,t,i,ro){ return `<div class="taskpanel">${taskPanelBody(l,t,i,ro)}</div>`; }
// shared by the plain panel and the V3 detail panel — DOD only。任務層「筆記」功能 2026-08-11 整個拆除
// （使用者裁決：之後狀態溝通走 Slack 連動，工具內不養第二個留言串）；卡片層備註（risks）是另一個功能，未動。
// t.notes 資料欄位保留不清 —— 舊 snapshot 還帶著它，v3SyncTasks 也還在補預設值，只是不再有任何 UI 讀寫。
function taskPanelBody(l,t,i,ro,noDod){
  const zh=LANG==="zh";
  return `${DOD[t.code]&&!noDod?`<div class="v3dod">✅ <b>${zh?"完成定義":"Done means"}</b> ${esc(v3T(DOD[t.code]))}${EVID.has(t.code)?` <span style="color:#67e8f9">· ${zh?"需附證明連結":"evidence link required"}</span>`:""}</div>`:""}`;
}
// unified V3 detail panel — coherent info block (output · note · days · owner), lock reason, shot-list, then notes
function taskDetail(l,t,i,ro,vn,lk){
  const zh=LANG==="zh", T=(z,e)=>zh?z:e;
  if(!vn) return lk?`<div class="taskpanel" style="color:var(--dim)">🔒 <b>${T("已鎖定","Locked")}</b> — ${esc(lockReason(l,t))}</div>`:taskPanel(l,t,i,ro);
  const info=[];
  info.push([T("負責人","Owner"), `<!--notx-->${esc(v3Own(vn))}<!--/notx-->`]);   // owner first
  // 「指派」自由欄位已移除（2026-07-31）—— 每一步都有負責人（V3 的 o／流程模板可覆寫），
  // 再開一層自由文字的指派只會出現兩個互相打臉的人名。
  if(vn.out) info.push([T("產出","Output"), esc(v3T(vn.out))]);
  if(DOD[t.code]) info.push([T("完成定義","Done means"), esc(v3T(DOD[t.code]))+(EVID.has(t.code)?` <span style="color:#67e8f9">· ${T("需附證明連結","evidence link required")}</span>`:"")]);
  if(vn.note) info.push([T("備註","Note"), esc(v3T(vn.note))]);
  info.push([vn.c==="P3"?T("生產天數","Production days"):T("預設天數","Default days"), vn.days==null
    ? (ro?`<span style="color:var(--amber)">${T("待負責部門填寫","to be filled in")}</span>`
        :`<input type="number" min="0" class="v3days-inp${t.days==null?" unfilled":""}" value="${t.days==null?"":t.days}" placeholder="${vn.est!=null?vn.est:T("需填寫","required")}" title="${T("此步驟天數每個產品不同，由負責部門填寫","varies per product — the owning dept fills it in")}" onclick="event.stopPropagation()" onchange="v3SetDays('${l.slug}',${i},this.value)"> ${T("天","d")}${vn.est!=null?` <span class="ghostnote">${T("預估 "+vn.est+"d","est "+vn.est+"d")}</span>`:""}`)
    : (vn.days===0?T("即時 / 事件","instant"):vn.days+"d")]);
  // due-date countdown — the clock starts automatically when the predecessor step(s) finish.
  // Manual-days steps (vn.days==null) take the due date DIRECTLY as a date input once the clock runs:
  // factories quote a delivery date, not a duration — typing it back-fills t.days (v3SetDue → v3SetDays).
  if(vn.days!==0){
    const startClock=v3StartClock(l,vn);
    const days=(t.days!=null?t.days:vn.days);                                               // per-launch override wins, else the template default
    const editable=!ro&&vn.days==null&&t.st!=="x"&&!!startClock;
    let due;
    if(t.st==="x"){ due=`<span class="ghostnote">${T("已完成","done")}${t.doneAt?" · "+fmt(t.doneAt):""}</span>`; }
    else if(editable){
      const dd=days!=null?v3AddD(startClock,days):"";
      const dateInp=`<input type="date" class="v3due-inp${days==null?" unfilled":""}" value="${dd}" min="${startClock}" title="${T("直接填工廠交期，天數自動回推（"+fmt(startClock)+" 起算）","type the factory-quoted date — the day budget back-fills from it (clock starts "+fmt(startClock)+")")}" onclick="event.stopPropagation()" onchange="v3SetDue('${l.slug}',${i},this.value)">`;
      if(days==null){ due=`${dateInp} <span class="ghostnote">${T("填交期即起算，天數自動回推","sets the countdown — days back-fill automatically")}</span>`; }
      else { const rem=dayDiff(today,dd), c=rem<0?"var(--red)":rem<=2?"var(--amber)":"var(--green)";
        due=`${dateInp} · <span style="color:${c};font-weight:600">${rem<0?T("已逾期","overdue")+" "+(-rem)+"d":T("剩","left")+" "+rem+"d"}</span>`; } }
    else if(days==null){ due=`<span style="color:var(--amber)">⚠ ${T("天數未填，倒數無法起算","days unset — countdown can't start")}</span>`; }
    else if(!startClock){ due=`<span class="ghostnote">${T("上一步完成後起算","starts when the previous step finishes")} · ${days}d</span>`; }
    else { const dd=v3AddD(startClock,days), rem=dayDiff(today,dd), c=rem<0?"var(--red)":rem<=2?"var(--amber)":"var(--green)";
      due=`${T("應完成","due")} <b>${fmt(dd)}</b> · <span style="color:${c};font-weight:600">${rem<0?T("已逾期","overdue")+" "+(-rem)+"d":T("剩","left")+" "+rem+"d"}</span>`; }
    info.push([T("應完成日 / 倒數","Due / countdown"), due]);
  }
  // 完成日／開工日的更正入口 — 蓋章一律蓋「今天」，補記錄整條排程就歪；v3SetStamp 有前置日/未來日守門
  if(t.st==="x") info.push([T("完成日","Done on"),
    ro?(t.doneAt?fmt(t.doneAt):"—")
      :`<input type="date" class="v3due-inp" value="${esc(t.doneAt||"")}" max="${today}" onclick="event.stopPropagation()" onchange="v3SetStamp('${l.slug}',${i},'doneAt',this.value)"> <span class="ghostnote">${T("補正實際完成日 — 排程與統計跟著這天","correct the actual completion date — schedule & stats follow it")}</span>`]);
  else if(t.st==="p") info.push([T("開工日","Started on"),
    ro?(t.startAt?fmt(t.startAt):"—")
      :`<input type="date" class="v3due-inp" value="${esc(t.startAt||"")}" max="${today}" onclick="event.stopPropagation()" onchange="v3SetStamp('${l.slug}',${i},'startAt',this.value)"> <span class="ghostnote">${T("補正實際開工日","correct the actual start date")}</span>`]);
  // 大貨樣步驟（P3）：預計大貨樣日就住在詳情裡（原本的外層列已移除）— 生產期間即可寄樣，P5 等這一天
  if(vn.sample){
    const sTip=T("大貨樣可寄出的日期 — P5（部署行銷樣品）等這一天。生產期間即可寄樣，非完工日","the date bulk samples can ship — P5 (Deploy marketing samples) waits for this. Ships mid-production; not the finish date");
    info.push([T("預計大貨樣日","Bulk-sample date"),
      ro?(t.sampleDate?fmt(t.sampleDate):"—")
        :`<input type="date" class="v3due-inp${t.sampleDate?"":" unfilled"}" value="${esc(t.sampleDate||"")}" title="${sTip}" onclick="event.stopPropagation()" onchange="v3SetDate('${l.slug}',${i},'sampleDate',this.value)"> <span class="ghostnote">${t.sampleDate?T("P5（部署行銷樣品）等這一天","P5 waits for this day"):T("未填 — P5 部署行銷樣品無法解鎖","unset — P5 stays locked")}</span>`]);
  }
  // 首波開賣日（FB1）：LC 一條龍處理出貨，系統只追這一個日期 — 填了就直接當預計上市日，全公司看卡片抬頭即可
  if(vn.arrival){
    const aTip=T("大貨到貨、可以開賣的那一天。填了就直接成為這張卡的『預計上市日』，蓋過自動推算","the day stock lands and selling can start. Once set it becomes this card's projected launch, overriding the auto-projection");
    const aLk=v3ArrivalLock(l,t), aFl=v3ArrivalFloor(l);   // min＝大貨完工日：過去的到貨日合法，早於完工日不可能
    info.push([T("到貨日 / 首波開賣日","Arrival / on-sale date"),
      ro?(t.arrivalDate?fmt(t.arrivalDate):"—")
      :aLk?`<input type="date" class="v3due-inp unfilled" value="${esc(t.arrivalDate||"")}" disabled aria-disabled="true"> <span class="ghostnote">🔒 ${esc(aLk)}</span>`
        :`<input type="date" class="v3due-inp${t.arrivalDate?"":" unfilled"}" value="${esc(t.arrivalDate||"")}"${aFl?` min="${aFl}"`:""} title="${aTip}" onclick="event.stopPropagation()" onchange="v3SetDate('${l.slug}',${i},'arrivalDate',this.value)"> <span class="ghostnote">${t.arrivalDate?T("＝本卡預計上市日","= this card's projected launch"):T("未填 — 預計上市日仍用自動推算","unset — projected launch stays auto-computed")}</span>${v3ArrivalNudge(l)?` <span class="urg high">${T("已到貨？記得標記完成","arrived? mark this step done")}</span>`:""}`]);
  }
  if(!lk) info.push([T("連結","Links"), linkChips(t,l.slug,i)]);   // the actual attached links live IN the detail, not only in the outer quick-link chip
  const grid=`<div class="v3det">${info.map(([k,v])=>`<div class="v3det-r"><span class="v3det-k">${k}</span><span class="v3det-v">${v}</span></div>`).join("")}</div>`;
  const lockBlk=lk?`<div class="v3det-lock">🔒 <b>${T("鎖定中","Locked")}</b> · ${esc(lockReason(l,t))}</div>`:"";
  const shots=vn.shots?v3ShotList(l,t,i,ro,vn):"";
  return `<div class="taskpanel">${grid}${lockBlk}${shots}</div>`;
}
// per-launch shot list — starter proposals differ by product, so quantities are editable and rows can be added/removed

/* ================= MASTER FLOW CHART RENDER (SVG, live-colored per launch) ================= */
/* ===== flow-chart label i18n (isolated from the global ZH dict) =====
   The master flow chart renders each node's .l label; long English labels used to
   wrap across multiple SVG <text> lines and so never matched the substring-replacement
   ZH dict, staying English in 中文 mode. FLOWZH translates the label BEFORE wrap() so
   the (short) Chinese shows. Kept SEPARATE from ZH so the chart wording can differ from
   the gate/task titles other views show — changing a label here has zero cross-view impact.
   Brand-token-heavy labels deliberately kept English are simply omitted (e.g. Next Smart
   Ship SKU, Amazon pickup / ship to Shipbob). */
const FLOWZH={
 // — lane headers (only overrides; the rest fall back to the global ZH dict) —
 "Catalog":"商品目錄",
 // the rest of the current 40 V3 node labels are auto-injected below — no hand-written entries needed
};
V3ALL.forEach(n=>{FLOWZH[n.en]=n.zh;}); // V3+V3U flow-chart labels → ZH (same source as the global ZH; chart uses its own dict)
const flowTL=s=>LANG==="zh"?(FLOWZH[s]||s):s;          // translate a flow label; fall back to English (then the global tx() pass)
// — adaptive flow-label typography: CJK-aware line breaking + fit-to-box font size.
//   Short labels grow to FL_MAX; long ones wrap (preferring ≤2 lines, uniform box height)
//   and shrink only as far as needed so a label NEVER overflows its node box, EN or 中文.
const FL_CJK=c=>/[⺀-鿿豈-﫿＀-￯　-〿]/.test(c);   // CJK ideographs/kana + fullwidth/CJK punctuation
let FL_LS=0;                                                                        // node-label letter-spacing (em); flowSVG widens it for 繁中 so glyphs breathe
const flowDW=s=>{let w=0;for(const c of s)w+=(FL_CJK(c)?1:0.56)+FL_LS;return w;};    // display width in "em" (CJK≈1, latin≈0.56, +tracking)
const FL_BRK="・：／·＋、";                                                          // break-after connectors (kept glued to the line they end)
function flowPieces(s){                                                              // split into wrap-atoms, remembering which had a leading space
  const out=[]; let pendingSpace=false;
  for(const w of s.split(/(\s+)/)){
    if(/^\s+$/.test(w)){pendingSpace=true;continue;}
    let buf="",first=true;
    for(const ch of w){ buf+=ch; if(FL_BRK.includes(ch)){out.push({t:buf,sp:first&&pendingSpace});buf="";first=false;pendingSpace=false;} }
    if(buf){out.push({t:buf,sp:first&&pendingSpace});pendingSpace=false;}
  }
  return out;
}
function flowPack(s,target,maxLines){                                                // greedily pack atoms into ≤maxLines lines near `target` display-width
  const ps=flowPieces(s),lines=[]; let cur="";
  for(const p of ps){
    const join=(cur&&p.sp)?cur+" "+p.t:cur+p.t;
    if(cur && flowDW(join)>target && lines.length<maxLines-1){lines.push(cur);cur=p.t;}
    else cur=join;
  }
  if(cur)lines.push(cur);
  return lines;
}
function flowLabel(s,boxW,maxN){                                                     // maxN: hard line cap (diamonds get 2 — their vertical band is 10px shorter than a rect's)
  const PAD=16, MAX=11.5, COMFORT=9.5, FLOOR=7.5, usable=boxW-PAD, NM=maxN||3;
  for(let n=1;n<=NM;n++){
    const lines=flowPack(s,Math.max(flowDW(s)/n,2)+0.01,n);
    const font=Math.min(MAX, usable/Math.max(...lines.map(flowDW)));
    if(font>=COMFORT||n===NM) return {lines, font:n===NM?Math.max(FLOOR,font):font};
  }
}

function flowSVG(l){

  const depts=Object.keys(FLOW);   // every lane v3Rederive seeds already has ≥1 node — no empty lane to filter out
  // spacing rhythm: related nodes group TIGHT inside a lane (VG 64 → 26px gaps), distinct lanes separate GENEROUSLY (GAP 46).

  const FT=flowTheme();
  const fill=FT.fill, strk=FT.strk;
  const stateOf=(n,d,i)=>{
    if(n.t){const t=l.tasks.find(x=>x.t===n.t); if(t){ if(t.st!=="o")return t.st; return nodeLocked(l,d,i)?"fut":"o"; }}
    const si=STAGES.indexOf(n.s),ci=STAGES.indexOf(l.stage);
    if(l.complete||si<ci) return "x";

  };
  // live-state badge width — CJK ≈11.8px, latin ≈6.4px, emoji ≈13px at font-size 11 bold (+16 padding)
  const pillW=s=>{let w=16;for(const ch of s)w+=/\p{Extended_Pictographic}/u.test(ch)?13:/[　-鿿豈-﫿]/.test(ch)?11.8:ch===" "?3.5:6.4;return Math.round(w);};
  const hintsOn=S.flowHints!==false;                   // dependency-highlight toggle (popover); off → calm chart
  // Dependency highlight — clicking a node traces its REAL req graph: prerequisites ➜ this node ➜ what it unblocks.
  // (Replaces the old lane-polyline "route", whose meaning was unclear.)
  const selN=S.route?((FLOW[S.route.d]||[])[S.route.i]||null):null;
  const selCode=selN?selN.code:null;
  const depOn=hintsOn&&!!S.route;
  // entrance choreography gate — animate ONCE per flow-view open, not on node-click / board-sync re-renders (DESIGN.md Motion).
  // Skip when a node is already selected (depOn) so the one-time stagger never fights the dependency-dim opacity attr.
  const _fctx=(l&&l.slug||"?")+"|"+(S.cardView||"flow");
  const _flowFirst=(FLOWSEEN!==_fctx)&&!depOn; FLOWSEEN=_fctx;
  const findByCode=code=>{ for(const dd of depts){const arr=FLOW[dd]||[]; for(let k=0;k<arr.length;k++) if(arr[k].code===code) return [dd,k];} return null; };
  const depEdges=[]; const depKeys=new Set();
  if(depOn&&selCode){ const selPos=[S.route.d,S.route.i]; depKeys.add(S.route.d+"|"+selN.l);
    (selN.req||[]).forEach(rc=>{const p=findByCode(rc); if(p){depEdges.push([p,selPos]); depKeys.add(p[0]+"|"+FLOW[p[0]][p[1]].l);}});   // prereq ➜ selected
    depts.forEach(dd=>(FLOW[dd]||[]).forEach((nn,k)=>{ if((nn.req||[]).includes(selCode)){depEdges.push([selPos,[dd,k]]); depKeys.add(dd+"|"+nn.l);} }));  // selected ➜ dependents
  }
  // node drop-shadow — theme-aware: dark/blue get a deep black lift; LIGHT gets a soft COOL-slate shadow (a black .55 shadow on a near-white node reads as the dirty smudge the reference light-mode never has).
  const nshDrop=THEME==="light"?'dy="2" stdDeviation="3.5" flood-color="#293248" flood-opacity="0.15"':'dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.55"';
  // NATURAL width (not width:100%) — a 1194px chart squeezed into a 900px column renders 11.5px type at 8.7px
  // and at 380px at 3.7px, and because it never overflows .flowwrap's overflow:auto never engages. Fixed width
  // + auto margins: centred when there's room, genuinely scrollable when there isn't. Type stays readable.
  // markerUnits=userSpaceOnUse — otherwise the marker scales with stroke-width and the 2.3px .depedge grows a 17px head.
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMin meet" xmlns="http://www.w3.org/2000/svg" style="font-family:inherit;width:${W}px;height:auto;max-width:none;margin-inline:auto;display:block">
  <defs><marker id="ar" viewBox="0 0 8 8" refX="7.4" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L8 4L0 8z" fill="${FT.arrow}"/></marker>
  <marker id="arR" viewBox="0 0 9 9" refX="8.4" refY="4.5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#EE3124"/></marker>
  <filter id="nsh" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" ${nshDrop}/></filter></defs>`;
  // lane headers — no container boxes; a dept-colored anchor dot + generous headroom mark each lane on the open field
  depts.forEach((d,c)=>{const x=GAP+c*(CW+GAP);
    svg+=`<g class="flowhead" style="--d:${Math.min(c*13,120)}ms"><text x="${x+CW/2}" y="34" text-anchor="middle" fill="${DCOLOR(d)}" font-size="12.5" font-weight="700" letter-spacing="${LANG==="zh"?0.08:0.03}em">${esc(flowTL(d))}</text>
    <circle cx="${x+CW/2}" cy="${47}" r="2.2" fill="${DCOLOR(d)}" opacity="0.85"/></g>`;});
  // in-lane connectors — ONLY the straight drop between two ADJACENT nodes that really do depend on each
  // other. Everything else the chart used to draw in grey (the arcs bowed out into the gutter for
  // skip-a-row dependencies, and the dashed cross-lane runs) is gone as of 2026-07-31: at chart scale a
  // 40-node DAG's full edge set is a tangle nobody reads, and the same information is available on demand
  // and far more legibly as the RED route that lights up when you click a node. What survives here is the
  // one edge family that is short, vertical and never crosses anything: this lane's running order.
  depts.forEach((d,c)=>FLOW[d].forEach((n,i)=>{const tp=pos(d,i),cx=tp.x+CW/2;
    (n.req||[]).forEach(rc=>{ const j=FLOW[d].findIndex(x=>x.code===rc); if(j<0||Math.abs(i-j)!==1)return;
      const sp=pos(d,j),dn=j<i,sy=dn?sp.y+hgt(d,j)+2:sp.y-2,ey=dn?tp.y-3:tp.y+hgt(d,i)+3,_ed=Math.min(140+c*12+i*14,300);
      svg+=`<path class="flowedge" pathLength="1" style="--d:${_ed}ms" d="M${cx} ${sy}L${cx} ${ey}" fill="none" stroke="${FT.arrow}" stroke-width="1.2" marker-end="url(#ar)"/><circle class="flowdot" style="--d:${_ed+90}ms" cx="${cx}" cy="${sy}" r="3" fill="${FT.arrow}"/>`;});}));
  // 跨車道的灰色虛線（CROSS）不再畫 —— 見上一段。CROSS 仍由 v3Rederive 導出（模板校驗與測試在用），
  // 只是不上圖；跨車道的依賴改由點節點時的紅線呈現。
  // nodes
  depts.forEach(d=>FLOW[d].forEach((n,i)=>{const {x,y}=pos(d,i);const st=stateOf(n,d,i);
    const frozen=isDesignFrozen(l)&&isFrozenDesignStage(n.s)&&st==="x";   // a done 概念/開發 node, locked by design freeze → render it iced
    const nf=frozen?FT.ice.fill:fill[st], ns=frozen?FT.ice.strk:strk[st];
    const ti=n.t?l.tasks.findIndex(x=>x.t===n.t):-1;
    const _tt=ti>=0?l.tasks[ti]:null, _vnn=n.code&&V3MAP[n.code];
    // live-state badges — EVERY lane's live work gets flagged, not just the single next gate criterion,
    // so parallel departments see their own 📍 instead of the chart looking like only Product has work:
    // frontier (unlocked, not started) → orange 📍 這裡 · in-progress → amber ⏳ 進行中 · blocked → red ⛔. Done/locked stay quiet.
    const live=_tt?(st==="p"?"p":st==="b"?"b":st==="o"?"o":null):null;
    const isHere=live==="o";
    // "needs input" flag — ONLY on work that is actually live (locked/done steps asking for a number is noise:
    // the old rule lit 11 red dots on a brand-new card), and it now covers the two hand-typed DATES as well,
    // which the days-only rule could never see (FB1 has days:31 so its 到貨日 was invisible; P3's 大貨樣日 too).
    // KOL steps are ongoing by design — they have no day estimate to give.
    const _live=st!=="fut"&&st!=="x";
    const needDays=!!(_live&&_vnn&&!_vnn.ongoing&&_vnn.days==null&&_vnn.est==null&&_tt&&_tt.days==null);
    const needDate=!!(_live&&_tt&&_vnn&&((_vnn.arrival&&!_tt.arrivalDate)||(_vnn.sample&&!_tt.sampleDate)));
    const needIn=needDays?"⏱":needDate?"📅":"";
    const key=d+"|"+n.l, inHi=depOn&&depKeys.has(key);
    const isSel=S.route&&S.route.d===d&&S.route.i===i;     // currently-open node (drives the popover anchor)
    const click=` class="flownode" style="cursor:pointer;--d:${Math.min(60+depts.indexOf(d)*14+i*15,220)}ms" onclick="event.stopPropagation();flowNode('${d}',${i})"`;
    const h=hgt(d,i);
    // badge row sits ENTIRELY above the tile (y-19..y-1). It used to straddle the top edge at y-10, which put it
    // through the first line of every 3-line label (D4 "PDP +", C9 "Ben"). 26px inter-row gap absorbs it.
    const BRY=y-19, BTY=y-6;
    const dash=st==="fut"&&!frozen?' stroke-dasharray="4 3"':"";   // locked reads as dashed, not as faint text (F32)
    const body=n.d
      ?`<polygon id="fn-${d}-${i}" filter="url(#nsh)" points="${x+CW/2},${y-2} ${x+CW+DXW},${y+NH/2} ${x+CW/2},${y+NH+2} ${x-DXW},${y+NH/2}" fill="${nf}" stroke="${isHere?"#EE3124":ns}" stroke-width="${isHere?2.5:1.4}"${dash}/>`
      :`<rect id="fn-${d}-${i}" filter="url(#nsh)" x="${x}" y="${y}" width="${CW}" height="${h}" rx="5" fill="${nf}" stroke="${isHere?"#EE3124":ns}" stroke-width="${isHere?2.5:1.4}"${dash}/>`;
    const tcol=frozen?FT.ice.txt:(FT.txt[st]||FT.txt.o);
    // the tile carries the step NAME and nothing else — code, day budget and lock state live in the popover,
    // one click away. (A `code · Nd` meta line under every label read as visual noise at chart scale.)
    // the title is ALWAYS centred on the tile. The ⏱/📅/❄ indicators used to sit in the top-right corner INSIDE
    // the tile, which forced a 26px-narrower label box shifted left — so a design-frozen (or waiting-on-input)
    // node's title visibly sat off-centre next to its neighbours. Both indicators now live in the badge row
    // above the tile with 📍/⏳/⛔, leaving the full width to the name.
    // diamonds get a narrower packing box so a long en name splits into two BALANCED lines instead of one
    // wide line + one short one — the wide line is what has to survive the wedge's taper.
    const LBW=CW-(n.d?30:0), LCX=x+CW/2;
    // clamp the font to the tile: flowLabel's 3-line branch keeps its own 11.5 max, which is how CRM2's old
    // long-form en label ("FAQ finalized + brief CS") used to stack 3×11.5×1.18=40.7px inside a 38px box.
    const LTOP=n.d?y+4:y, LBH=n.d?NH-8:NH;
    let lay=flowLabel(flowTL(n.l),LBW,n.d?2:3);
    // A diamond's two lines are sized by the WIDER of them, so an uneven split ("Ben" / "concept sign-off")
    // costs ~1.5px of type versus an even one. Re-split at the word gap closest to the middle and keep whichever
    // layout survives the taper better (measured below). Rects have no taper, so they keep the packer's output.
    if(n.d){ const ws=flowTL(n.l).split(/\s+/).filter(Boolean);
      if(ws.length>1&&lay.lines.length===2){
        let bi=1,bd=Infinity;

      } }
    const nl=lay.lines.length;

    // still push the outermost line through the sloped edge. Solve for the font where the widest line still fits

    if(n.d){ const HW=CW/2+DXW, HH=NH/2+2, dw=Math.max(...lay.lines.map(flowDW)), c=(nl-1)*0.59+0.72;
      F=+Math.min(F, 2*HW/(dw+2*HW*c/HH)).toFixed(2); }
    const lg=F*1.18, cy=LTOP+LBH/2;

    svg+=`<g${click}${depOn&&!depKeys.has(key)?' opacity="0.18"':""}>${body}${isSel?`<rect class="fn-sel" x="${x-3}" y="${y-3}" width="${CW+6}" height="${h+6}" rx="7" fill="none" stroke="#EE3124" stroke-width="2.5" pointer-events="none"/>`:""}${inHi&&!isSel?`<rect class="glownode" x="${x-3}" y="${y-3}" width="${CW+6}" height="${h+6}" rx="7" fill="none" stroke="#EE3124" stroke-width="1.8" opacity="0.8" pointer-events="none"/>`:""}${labelSVG}
    ${n.d&&!live?`<text x="${x+CW/2}" y="${y-7}" text-anchor="middle" fill="#c084fc" font-size="11" stroke="${FT.field}" stroke-width="2.8" paint-order="stroke" stroke-linejoin="round">◆ decision</text>`:""}
    ${(()=>{const BJ=live==="o"?{t:"📍 "+(LANG==="zh"?"這裡":"here"),bg:"#EE3124",fg:"#fff"}
           :live==="p"?{t:"⏳ "+(LANG==="zh"?"進行中":"in progress"),bg:"#fbbf24",fg:"#111215"}
           :live==="b"?{t:"⛔ "+(LANG==="zh"?"卡關":"blocked"),bg:"#f87171",fg:"#111215"}:null;
      // ❄ frozen and ⏱/📅 needs-input moved OUT of the tile (they used to push the title off-centre) into this
      // row. They can never collide: ❄ only paints on a done node (no live badge), ⏱/📅 only on a live one.
      if(frozen&&!n.d) return `<text x="${x+3}" y="${BTY}" fill="${FT.ice.strk}" font-size="11" font-weight="700" pointer-events="none">❄</text>`;
      if(!BJ)return ""; const w=pillW(BJ.t);
      // ⏱/📅 sits immediately right of the live badge — first in the row after it, because "this needs a number
      // from you" outranks "who owns it" when both compete for the band.

        inSVG=`<g pointer-events="none"><circle cx="${icx}" cy="${BRY+9}" r="8.6" fill="rgba(248,113,113,.18)" stroke="rgba(248,113,113,.9)" stroke-width="1.1"/><text x="${icx}" y="${BRY+12.6}" text-anchor="middle" font-size="9.5">${needIn}</text></g>`; }
      // 📍 frontier badge carries WHO starts — owner chip to the right (V3OC color, notx-guarded name).
      // Width is capped to this column's band (CW+GAP): compound owners collapse to "First +n", then ellipsis.
      let ownSVG="";
      if(isHere){ const owners=v3Owners(v3Own(_vnn)||(_tt&&_tt.o)||"");
        if(owners.length){ const bx0=x-4+w+4+iw, max=CW+GAP-8-(w+4+iw), edge=bx0+max;   // edge = the hard right limit of this column's band
          const chip=(cx,nm,cls)=>{const nc=v3OColor(nm),nw=pillW(nm);return {w:nw,svg:`<g class="fn-own${cls}"><rect x="${cx}" y="${BRY}" width="${nw}" height="18" rx="9" fill="${FT.colBg}" stroke="${nc}" stroke-width="1.2"/><text x="${cx+nw/2}" y="${BTY}" text-anchor="middle" fill="${nc}" font-size="10.5" font-weight="700"><!--notx-->${esc(nm)}<!--/notx--></text></g>`};};
          const fit=(nm,room)=>{ if(pillW(nm)<=room)return nm; let s=nm; while(s.length>1&&pillW(s+"…")>room) s=s.slice(0,-1); return s+"…"; };
          const f=chip(bx0,fit(owners[0],max),""); ownSVG=f.svg; let ox=bx0+f.w+5;

            if(ox+mw<=edge) ownSVG+=`<g class="fn-more"><rect x="${ox}" y="${BRY}" width="${mw}" height="18" rx="9" fill="${FT.colBg}" stroke="${FT.colLine}" stroke-width="1.2"/><text x="${ox+mw/2}" y="${BTY}" text-anchor="middle" fill="${FT.txt.o}" font-size="10.5" font-weight="700">${mt}</text></g>`;
            // ONE chip for all co-owners, not a chip each: after the 📍 badge only ~56px of the lane band survive,
            // and side-by-side chips spend the 16px pill padding per name — MS1's 3rd owner then fell off the end
            // while "+2" still promised it. Joined + ellipsised keeps the count honest and never leaves the band.
            const rest=owners.slice(1), one=rest.length===1, rc=one?v3OColor(rest[0]):FT.colLine, room=edge-ox;
            if(room>=26){ const rt=fit(rest.join(" · "),room), rw=pillW(rt);
              ownSVG+=`<g class="fn-own-2"><rect x="${ox}" y="${BRY}" width="${rw}" height="18" rx="9" fill="${FT.colBg}" stroke="${rc}" stroke-width="1.2"/><text x="${ox+rw/2}" y="${BTY}" text-anchor="middle" fill="${one?rc:FT.txt.o}" font-size="10.5" font-weight="700"><!--notx-->${esc(rt)}<!--/notx--></text></g>`; }
          }
        } }
      return `<g pointer-events="none"><rect x="${x-4}" y="${BRY}" width="${w}" height="18" rx="9" fill="${BJ.bg}"/><text x="${x-4+w/2}" y="${BTY}" text-anchor="middle" fill="${BJ.fg}" font-size="11" font-weight="700">${BJ.t}</text>${inSVG}${ownSVG}</g>`;})()}
    <title>${esc(n.l)} — ${LANG==="zh"?"階段：":"stage: "}${n.s} · ${LANG==="zh"?"點一下看依賴與快捷動作":"click for route + quick actions"}${st==="fut"&&ti>=0?(LANG==="zh"?" · 🔒 鎖定中 — 等前一步完成":" · 🔒 locked until previous step is done"):""}${live==="o"?(LANG==="zh"?" · 📍 已解鎖，可開始":" · 📍 unlocked — ready to start")+(v3Own(_vnn)||(_tt&&_tt.o)?(LANG==="zh"?" · 負責人 ":" · owner: ")+"<!--notx-->"+esc(String(v3Own(_vnn)||(_tt&&_tt.o)))+"<!--/notx-->":""):live==="p"?(LANG==="zh"?" · ⏳ 進行中":" · ⏳ in progress"):live==="b"?(LANG==="zh"?" · ⛔ 卡關":" · ⛔ blocked"):""}${needDays?(LANG==="zh"?" · ⏱ 天數未填":" · ⏱ days not set"):""}${needDate&&_vnn&&_vnn.arrival?(LANG==="zh"?" · 📦 到貨日未填":" · 📦 arrival date not set"):""}${needDate&&_vnn&&_vnn.sample?(LANG==="zh"?" · 🧵 大貨樣日未填":" · 🧵 bulk-sample date not set"):""}</title></g>`;}));
  // red dependency arrows (drawn on top so they clearly reach the highlighted nodes)
  depEdges.forEach(([a,b])=>{const pa=pos(a[0],a[1]),pb=pos(b[0],b[1]),ha=hgt(a[0],a[1]),hb=hgt(b[0],b[1]); let dpath;
    if(a[0]===b[0]){ const ax=pa.x+CW/2, ay=pa.y+ha, bx=pb.x+CW/2, by=pb.y-5, my=(ay+by)/2; dpath=`M${ax} ${ay} C ${ax} ${my}, ${bx} ${my}, ${bx} ${by}`; }
    else{ const l2r=pb.x>=pa.x, ax=l2r?pa.x+CW:pa.x, ay=pa.y+ha/2, bx=l2r?pb.x-5:pb.x+CW+5, by=pb.y+hb/2, mx=(ax+bx)/2; dpath=`M${ax} ${ay} C ${mx} ${ay}, ${mx} ${by}, ${bx} ${by}`; }
    svg+=`<path class="depedge" d="${dpath}" fill="none" stroke="#EE3124" stroke-width="2.3" marker-end="url(#arR)"/>`;});
  svg+="</svg>";
  return `<div class="flowwrap${_flowFirst?' flowin':''}">${svg}</div>`;        // .flowin → play the entrance choreography once (gated above); route intro + actions live in the inline #flowPop popover
}

/* ===== flow-node inline popover (route intro · files/links · hint toggle) =====
   Clicking a node opens a fixed popover anchored beside it — no more scroll-to-top
   red banner. S.route holds the selected node; S.flowHints (persisted) gates the
   animated red route highlight on the chart. Nodes + the popover stopPropagation,
   so the lone document-click listener only fires for genuine outside clicks.
   pop:true distinguishes a node-click popover from cycle()'s highlight-only route. */
function flowNode(d,i){
  const FLOW=flowOf(L(S._flowSlug)||{});             // popover context = the card the chart drew
  const n=FLOW[d]&&FLOW[d][i]; if(!n)return;
  const key=d+"|"+n.l;
  if(S.route&&S.route.pop&&S.route.key===key){S.route=null;render();return;}   // click the open node again → close
  S.route={key,d,i,pop:true}; render();                                        // pop:true → syncFlowPop() opens the popover (cycle() sets route WITHOUT pop = chart highlight only)
}
function toggleFlowHints(on){
  S.flowHints=!!on;
  try{if(typeof localStorage!=="undefined")localStorage.setItem("bv-flow-hints",on?"1":"0");}catch(e){}
  toast(on?"Route hints on":"Route hints off"); render();
}
function closeFlowPop(){ S.route=null; render(); }
function fpLinkLabel(u){try{const host=new URL(u).hostname.replace(/^www\./,"");
  if(/figma/.test(host))return"Figma"; if(/drive\.google|docs\.google/.test(host))return"Drive";
  if(/loom/.test(host))return"Loom"; if(/youtu/.test(host))return"YouTube"; if(/amazon/.test(host))return"Amazon";
  return host||"Link";}catch(e){return"Link";}}
function fpAddLink(slug,i){
  const inp=document.getElementById("fpLinkU"); if(!inp)return;
  let u=(inp.value||"").trim(); if(!u){inp.focus();return;}
  if(!/^https?:\/\//i.test(u)) u=(/^[\w.-]+\.[a-z]{2,}/i.test(u)?"https://":"")+u;
  const t=slug==="__camp"?(curCamp()||{tasks:[]}).tasks[i]:L(slug).tasks[i];
  if(!t)return; (t.links=t.links||[]).push({n:fpLinkLabel(u),u});
  toast("🔗 Link attached"); render();
  setTimeout(()=>{const x=document.getElementById("fpLinkU"); if(x)x.focus();},30);
}
/* Manual drag position for the inspector, in viewport px. The popover auto-parks beside its node, which
   often lands right on top of the dependency lines it is describing — grabbing the head overrides the
   auto-placement until the popover closes or a DIFFERENT node is opened (FP_DRAG.key guards that). */
let FP_DRAG=null;
function flowPopEl(){let p=document.getElementById("flowPop");
  if(!p){p=document.createElement("div"); p.id="flowPop";
    p.addEventListener("click",e=>e.stopPropagation());
    p.addEventListener("pointerdown",e=>{
      const head=e.target.closest&&e.target.closest(".fp-head");
      if(!head||e.button||(e.target.closest&&e.target.closest("button,input,select,textarea,a")))return;
      // grab offset off the LOGICAL position (style.left/top), not getBoundingClientRect — the fpIn
      // entrance animates translateY(6px), so a rect read within that 180ms window drifts the drag.
      const b=p.getBoundingClientRect();
      const bx=parseFloat(p.style.left), by=parseFloat(p.style.top);
      const dx=e.clientX-(isNaN(bx)?b.left:bx), dy=e.clientY-(isNaN(by)?b.top:by);

// after finishing a step in the inspector, walk the popover to the sensible NEXT step so the flow
// reads as a continuous path: the dependent this step just unblocked (earliest in V3 order, open &
// actionable) → else the next open node in the same lane → else a still-locked dependent (shows what
// it now waits on). Returns a pop-route ({key,d,i,pop}) or null when nothing sensible comes next.
function flowAdvanceRoute(l,fromCode,curD,curI){
  if(!l||!fromCode)return null;
  const FLOW=flowOf(l);
  const depts=Object.keys(FLOW);
  const taskOf=c=>(l.tasks||[]).find(x=>x.code===c);
  const ord=c=>{const k=V3ALL.findIndex(v=>v.c===c);return k<0?9999:k;};
  const mk=(d,i)=>{const nn=FLOW[d]&&FLOW[d][i];return nn?{key:d+"|"+nn.l,d,i,pop:true}:null;};
  const deps=[];
  depts.forEach(dd=>(FLOW[dd]||[]).forEach((nn,k)=>{ if(nn.code&&(nn.req||[]).includes(fromCode)) deps.push([dd,k,nn.code]); }));
  // P5 掛在 P3 的大貨樣特例（P3s）上、不是 req 邊 —— P3 完成也算放行，候選裡要有它
  if(fromCode==="P3"&&!deps.some(x=>x[2]==="P5")) depts.forEach(dd=>(FLOW[dd]||[]).forEach((nn,k)=>{ if(nn.code==="P5") deps.push([dd,k,"P5"]); }));
  deps.sort((a,b)=>ord(a[2])-ord(b[2]));
  for(const[dd,k,c]of deps){const t=taskOf(c); if(t&&t.st!=="x"&&!taskLocked(l,t))return mk(dd,k);}     // unblocked & actionable
  const lane=FLOW[curD]||[];                                                                            // else same-lane continuation
  for(let k=(curI==null?-1:curI)+1;k<lane.length;k++){const t=taskOf(lane[k].code); if(t&&t.st!=="x")return mk(curD,k);}
  for(const[dd,k,c]of deps){const t=taskOf(c); if(t&&t.st!=="x")return mk(dd,k);}                        // else the waiting-on dependent
  return null;
}

// complete / reopen a step straight from the inspector (mirrors the card's status tick, jumps to done)
async function fpComplete(slug,i,el){
  const l=L(slug),t=l&&l.tasks[i]; if(!t)return;
  if(taskLocked(l,t)){ bvShake(el); toast("🔒 "+lockReason(l,t)); return; }   // still locked → nudge + name the missing prerequisite
  if(!await confirmFrozenStepEdit(l,t))return;
  const done=t.st==="x";
  if(done){                                                                    // reopening → cascade-reopen the completed downstream steps that depend on it
    const g=await guardReopen(l,t,el); if(!g.ok) return;
    g.reset.forEach(d=>{d.st="o"; if(d.doneAt)delete d.doneAt;});
    if(g.reset.length) toast(LANG==="zh"?("↩ 已一併退回後續 "+g.reset.length+" 個步驟"):("↩ Reset "+g.reset.length+" downstream step(s)"));
  }

  if(done)delete t.doneAt; else { t.doneAt=today; if(!t.startAt)t.startAt=today; }   // stamp start too — completing straight o→x skips the p step that normally sets startAt
  v3Advance(l);   // re-derive stage / complete / history — mirrors cycle()/approve(); without it the card's phase goes stale after completing from the flow inspector
  if(!done) flowStepTo(flowAdvanceRoute(l,t.code,S.route&&S.route.d,S.route&&S.route.i));   // just completed → step the popover to the next node in the path

// approve / revoke a Ben ◆ gate straight from the inspector — same verbs as the card's approve()/unapprove(),

async function fpApprove(slug,i,el){
  const l=L(slug),t=l&&l.tasks[i]; if(!t)return;
  if(S.role!=="ceo"){ bvShake(el); toast("◆ gates can only be approved by Ben (CEO)"); return; }
  if(t.st!=="x"&&taskLocked(l,t)){ bvShake(el); toast("🔒 "+lockReason(l,t)); return; }
  if(t.st==="x"){
    const g=await guardReopen(l,t,el); if(!g.ok)return;
    g.reset.forEach(dd=>{dd.st="o"; if(dd.doneAt)delete dd.doneAt;});
    if(g.reset.length) toast(LANG==="zh"?("↩ 已一併退回後續 "+g.reset.length+" 個步驟"):("↩ Reset "+g.reset.length+" downstream step(s)"));

    if(nx){ S.route=nx; render(); flowScrollTo(nx); }
  }
}

   via doneAt timestamps; legacy tasks done before doneAt existed read as pre-history. */
const PULSE_W=16;
function pulseWeeks(){ const dow=(D(today).getDay()+6)%7;            // 0 = Monday
  const w0=v3AddD(today,-dow-(PULSE_W-1)*7);
  return Array.from({length:PULSE_W},(_,i)=>v3AddD(w0,i*7)); }
function pulseData(){
  const weeks=pulseWeeks(), w0=weeks[0], wEnd=v3AddD(weeks[PULSE_W-1],6);
  const mk=()=>({a:Array(PULSE_W).fill(0),d:Array(PULSE_W).fill(0)});
  const M={}; DEPTS().forEach(dp=>M[dp]=mk()); const tot=mk();
  LAUNCHES.forEach(l=>(l.tasks||[]).forEach(t=>{
    const r=M[t.d]; if(!r) return;
    if(t.st==="x"&&t.doneAt&&t.doneAt>=w0&&t.doneAt<=wEnd){
      const wi=Math.floor(dayDiff(w0,t.doneAt)/7); r.d[wi]++; tot.d[wi]++; }
    if(t.st==="x"&&!t.doneAt) return;                      // legacy done w/o date → pre-history
    if(t.st!=="x"&&taskLocked(l,t)) return;                // locked right now → never been available
    let from=w0; const n=t.code&&V3MAP[t.code];
    ((n&&n.req)||[]).forEach(rc=>{ const rt=(l.tasks||[]).find(x=>x.code===rc);
      if(rt&&rt.doneAt&&rt.doneAt>from) from=rt.doneAt; }); // undated done reqs = unlocked long ago
    if(t.code==="P5"){ const p3=(l.tasks||[]).find(x=>x.code==="P3");
      if(p3&&p3.sampleDate&&p3.sampleDate>from) from=p3.sampleDate; }
    const to=t.st==="x"?t.doneAt:today;
    if(to<from) from=to;                                   // doneAt-order drift guard
    if(to<w0||from>wEnd) return;
    const a0=Math.max(0,Math.floor(dayDiff(w0,from)/7));
    const a1=Math.min(PULSE_W-1,Math.floor(dayDiff(w0,to)/7));
    for(let i=a0;i<=a1;i++){ r.a[i]++; tot.a[i]++; }
  }));
  return {weeks,M,tot};
}
const pulseCls=(a,d)=>!a?"none":!d?"idle":(d/a)<.5?"l1":(d/a)<.75?"l2":(d/a)<1?"l3":"l4";
function pulseStreak(r){ let s=0; for(let i=PULSE_W-1;i>=0;i--){ if(!r.a[i]) continue; if(r.d[i]>0)s++; else break; } return s; }
function pulseIdleRun(r){ let s=0; for(let i=PULSE_W-1;i>=0&&!r.a[i];i--) s++; return s; }

/* ============ PROJECTS — domain helpers (ported from projectDomain.ts / projectStats.ts) ============ */
function pjToday(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());}
function pjIsIso(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||"");}
function pjDayDiff(a,b){const x=Date.parse((a||"").slice(0,10)+"T00:00:00Z"),y=Date.parse((b||"").slice(0,10)+"T00:00:00Z");if(isNaN(x)||isNaN(y))return 0;return Math.round((y-x)/864e5);}
function pjStages(p){return [p.stage_design,p.stage_sample,p.stage_pps,p.stage_bulk];}
function pjNotes(p){return [p.note_design,p.note_sample,p.note_pps,p.note_bulk];}
function pjFinished(p){return pjStages(p).every(s=>s==="done"||s==="na");}
function pjCurrentStage(p){const c=pjStages(p);for(let i=3;i>=0;i--)if(c[i]==="progress")return i;for(let i=0;i<4;i++)if(c[i]==="pending")return i;return 3;}
const PJ_URANK={hot:1,soon:2,prod:3,wait:4,plan:5,none:6};
const PJ_URGENCY_ORDER=["hot","soon","prod","wait","plan","none"];
function pjTier(p,t){if(pjFinished(p))return 7;if(pjIsIso(p.due_date)&&p.due_date<t)return 0;return PJ_URANK[p.urgency]!=null?PJ_URANK[p.urgency]:6;}
function pjCmp(t){return (a,b)=>{const d=pjTier(a,t)-pjTier(b,t);if(d)return d;const da=a.due_date||"9999-12-31",db=b.due_date||"9999-12-31";if(da!==db)return da<db?-1:1;const sd=pjCurrentStage(b)-pjCurrentStage(a);if(sd)return sd;return (a.name||"").localeCompare(b.name||"");};}
function pjMD(iso){const m=(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})/);return m?(+m[2])+"/"+(+m[3]):(iso||"");}
function pjWhen(p){return p.due_date?pjMD(p.due_date):(p.when_label||"");}
function pjOverdue(p,t){return pjIsIso(p.due_date)&&p.due_date<t?pjDayDiff(p.due_date,t):0;}
function pjUntil(p,t){return pjIsIso(p.due_date)&&p.due_date>=t?pjDayDiff(t,p.due_date):Infinity;}
function pjA(s){return esc(s||"").replace(/"/g,"&quot;");} // safe for attribute values

/* ============ PROJECTS — presentation maps ============ */
const PJ_STAGE_LBL=["Design","Sample","PPS","Bulk"];
const PJ_URGENCY_ICON={hot:"🔥",soon:"⏰",prod:"🏭",wait:"⏳",plan:"📅",none:""};
const PJ_URGENCY_LBL={hot:"Urgent",soon:"This week",prod:"In production",wait:"Waiting",plan:"Planned",none:"—"};
const PJ_TIER_LBL=["🔴 Overdue","🔥 Urgent","⏰ This Week","🏭 Bulk in Production / Transit","⏳ Waiting","📅 To Schedule","— Unsorted","✅ Completed"];
const PJ_TIER_BAR=["var(--red)","var(--red)","var(--amber)","var(--blue)","#4b5563","#5b6678","#6b7789","var(--green)"];
// Stage cells: done/in-progress carry their semantic fill (the prominent green/amber the team scans for); pending/na stay quiet. A status glyph is added so it isn't color-only.
const PJ_SEG={done:"background:rgba(74,222,128,.15);color:var(--green)",progress:"background:rgba(251,191,36,.15);color:var(--amber)",pending:"color:var(--faint)",na:"color:var(--faint)"};
const PJ_SEG_ICON={done:"✓",progress:"●",pending:"○",na:"—"};
const PJ_SEG_ICOLOR={done:"var(--green)",progress:"var(--amber)",pending:"var(--faint)",na:"var(--faint)"};
const PJ_TAG={hot:"background:rgba(248,113,113,.14);color:var(--red);border-color:rgba(248,113,113,.5)",soon:"background:rgba(251,191,36,.14);color:var(--amber);border-color:rgba(251,191,36,.5)",prod:"background:rgba(96,165,250,.14);color:var(--blue);border-color:rgba(96,165,250,.5)",wait:"color:var(--dim);border-color:var(--line)",plan:"color:var(--dim);border-color:var(--line)",none:"color:var(--faint);border-color:var(--line)",overdue:"background:rgba(248,113,113,.14);color:var(--red);border-color:rgba(248,113,113,.5)"};
function pjSegText(s,note){if(s==="done")return "Done";if(s==="progress")return note||"In progress";if(s==="na")return "No sample";return "—";}
// unknown urgency (e.g. the sheet's "dated") falls back to "none" — mirrors the portal.
function pjTag(p,t){const overdue=pjTier(p,t)===0;const u=PJ_URGENCY_LBL[p.urgency]?p.urgency:"none";const st=overdue?PJ_TAG.overdue:PJ_TAG[u];const icon=overdue?"":PJ_URGENCY_ICON[u];const label=overdue?[pjWhen(p),"Overdue "+pjOverdue(p,t)+"d"].filter(Boolean).join(" · "):(pjWhen(p)||PJ_URGENCY_LBL[u]);return `<span class="pjtag" style="${st}">${icon?icon+" ":""}${esc(label)}</span>`;}

/* ============ PROJECTS — one triage row ============ */
function pjRow(p,tier,showHeader,headerFirst,mode,t){
  const overdue=tier===0, soon=!overdue&&!pjFinished(p)&&pjUntil(p,t)<=7;
  const stages=pjStages(p), notes=pjNotes(p), when=pjWhen(p);
  const head=showHeader?`<div class="pj-tier${headerFirst?" first":""}">${PJ_TIER_LBL[tier]}</div>`:"";
  const right=mode==="next"
    ? `<div class="pj-next">${pjFinished(p)?`<span style="color:var(--green);font-size:12px">✅ Completed</span>`:`${pjTag(p,t)}<span style="font-size:12px;color:${p.next_action?"var(--dim)":"var(--faint)"}">${p.next_action?esc(p.next_action):"— (next action TBD)"}</span>`}</div>`
    : `<div class="pj-stages">${stages.map((s,i)=>{const seg=PJ_SEG[s]?s:"pending";const vtext=(seg==="pending"||seg==="na")?"":" "+esc(pjSegText(s,notes[i]));return `<div class="pj-cell" style="${PJ_SEG[seg]}" title="${pjA((s==="progress"?"In progress":pjSegText(s,notes[i]))+(notes[i]?" — "+notes[i]:""))}"><span class="k">${PJ_STAGE_LBL[i]}</span><span class="v"><span class="pj-ic" style="color:${PJ_SEG_ICOLOR[seg]}">${PJ_SEG_ICON[seg]}</span>${vtext}</span></div>`;}).join("")}</div>`;
  return `${head}<button type="button" class="pj-row pj-clickable${mode==="next"?" pj-row-next":""}${overdue?" overdue":soon?" soon":""}" aria-label="${pjA(p.name+(p.mo?" "+p.mo:"")+" — "+PJ_TIER_LBL[tier].replace(/^[^ ]+ /,"")+(when?" — "+when:"")+" — open detail")}" onclick="pjOpen('${pjA(p.id||p.name)}')">
    <div style="min-width:0">
      <div style="min-width:0;display:flex;align-items:center"><span class="pj-name${overdue?" overdue":""}">${esc(p.name)}</span>${p.mo?`<span class="pj-mo">${esc(p.mo)}</span>`:""}</div>
      <div class="pj-sub">${overdue?`<span class="pj-badge">Overdue ${pjOverdue(p,t)}d</span> `:""}${esc(p.supplier||"")}${when?" · "+esc(when):""}</div>
    </div>
    ${right}
  </button>`;
}

function pjCountBy(arr,key){const m=new Map();for(const p of arr){const v=key(p);if(!v)continue;m.set(v,(m.get(v)||0)+1);}return [...m.entries()];}
function pjMatch(p){const q=(S.pjQ||"").trim().toLowerCase();if(!q)return true;const hay=[p.name,p.supplier,p.mo,p.next_action,p.note_design,p.note_sample,p.note_pps,p.note_bulk].join(" ").toLowerCase();return q.split(/\s+/).every(tok=>hay.includes(tok));}
function pjPasses(p,t){
  if(S.pjFCat&&p.category!==S.pjFCat)return false;
  if(S.pjFSup&&p.supplier!==S.pjFSup)return false;
  if(S.pjFStage!=null&&(pjFinished(p)||pjCurrentStage(p)!==S.pjFStage))return false;
  if(S.pjFUrg&&p.urgency!==S.pjFUrg)return false;
  if(S.pjFDue==="overdue"&&pjTier(p,t)!==0)return false;
  if(S.pjFDue==="week"){if(pjFinished(p)||!pjIsIso(p.due_date)||p.due_date<t)return false;if(pjDayDiff(t,p.due_date)>7)return false;}
  return pjMatch(p);
}

let PCHAT={msgs:(function(){try{return JSON.parse((typeof localStorage!=="undefined"&&localStorage.getItem("bv-pchat"))||"[]")||[];}catch(e){return [];}})(),busy:false,busyAt:0};   // persists across refresh (per-user, localStorage)
function pchatSave(){ try{ localStorage.setItem("bv-pchat",JSON.stringify((PCHAT.msgs||[]).slice(-40))); }catch(e){} }
function progressDigest(){
  if(!(typeof PROJECTS!=="undefined"&&PROJECTS.length)) return "(no project data loaded yet)";
  return PROJECTS.map(p=>{ const st=pjStages(p);
    const stages=PJ_STAGE_LBL.map((lbl,i)=>lbl+":"+(st[i]||"?")).join(", ");
    const notes=["Design:"+(p.note_design||""),"Sample:"+(p.note_sample||""),"PPS:"+(p.note_pps||""),"Bulk:"+(p.note_bulk||"")].filter(s=>!/:$/.test(s));
    return ["• "+(p.name||"(unnamed)")+(p.category?" ["+p.category+"]":""),
      "  supplier: "+(p.supplier||"—")+(p.mo?" · MO "+p.mo:""),
      "  manufacturing stages — "+stages+"  → current: "+(PJ_STAGE_LBL[pjCurrentStage(p)]||"?"),
      "  due: "+(p.due_date||"—")+(p.urgency?" · urgency: "+p.urgency:""),
      p.next_action?"  next action: "+p.next_action:"",
      notes.length?("  notes: "+notes.join(" | ")):""
    ].filter(Boolean).join("\n");
  }).join("\n\n").slice(0,9000);
}
function progressSpecDigest(){ const c=(typeof KNOWLEDGE!=="undefined"&&KNOWLEDGE.catalog)||[]; if(!c.length)return "";
  return "\n\nPRODUCT SPECS (catalog — dimensions / materials / hardware / etc.):\n"+c.slice(0,40).map(x=>"• "+(x.name||x.product||x.model||x.sku||x.id||"?")+": "+JSON.stringify(x).replace(/[{}"]/g," ").replace(/\s+/g," ").trim().slice(0,260)).join("\n").slice(0,4500); }
const ENGLISH_ONLY="OUTPUT LANGUAGE — DEFAULT ENGLISH, NEVER LEAK CHINESE (hard rule). Write entirely in English unless the user EXPLICITLY asks for Chinese or bilingual output. The knowledge base is bilingual: there are Traditional-Chinese strategy documents and a Chinese `_zh` twin for nearly every catalog field. When a tool returns Chinese, TRANSLATE the facts you use into natural English — prefer the English `_en` fields and treat `_zh`/Chinese docs ONLY as a source to translate from. NEVER copy a Chinese/CJK character into a reply, persona, quote, headline, brief, title, or saved document; paraphrase Chinese sources in English. Any CJK character in English output is a defect — re-render it in English before sending.\n";
const FACTS_ONLY="FACTUAL INTEGRITY — ABSOLUTE RULE, OVERRIDES EVERYTHING ELSE. Every factual claim you write — any product spec, number, price, weight, dimension, capacity, material, feature, warranty, date, customer/review quote, competitor fact, or performance/sales/ROAS/inventory figure — MUST come VERBATIM from data a tool actually returned THIS turn (catalog, Core collections, research, card attachments). If a needed fact was not returned by a tool, you MUST write \"[not recorded]\" or omit it — you may NEVER invent, infer, estimate, approximate, round, recall from training / general knowledge, or fill a gap with a plausible-sounding number or claim. Do NOT state that a product, SKU, spec value, price, or competitor fact is true unless a tool surfaced it this turn; a blank/absent field means \"not recorded\", never a guess. The ONLY things you may decide yourself are CREATIVE/EDITORIAL choices (angle, tone, structure, which audience to lead with, ordering) — present those as recommendations, never as facts. When unsure whether something is a fact you actually saw in the data, LEAVE IT OUT. A short, fully-grounded answer is REQUIRED over a longer one containing even one guessed fact. If you have no grounded data to answer, say so plainly and name exactly what is missing — do NOT fabricate.\n";
const WRITING_CRAFT="WRITING CRAFT — how to WRITE (governs WORDING only; it NEVER overrides the FACTUAL INTEGRITY rule above — craft the words, never the facts; never embellish a number or invent a claim to read better). Write like a sharp in-house strategist briefing the founder: plain, confident, specific, a little dry — the calm precision of a premium-gear engineer who is also a great writer. Lead with the point, not a preamble or a restatement of the question. Vary sentence rhythm: mix a short punch with a longer explanatory line; never a wall of same-length sentences. Prefer concrete nouns and strong active verbs over adjectives; cut hype and filler ('it seems', 'perhaps', 'very', 'truly', 'in today's landscape', 'it is important to note'). State the facts you DO have with full confidence and zero hedging — qualifiers are for genuine data gaps only, not a nervous tic; when a fact is missing, omit it cleanly or gather gaps into one short 'To confirm:' line at the end rather than burying a marker mid-sentence. Use a list only when items are truly parallel; where a benefit, hook, or positioning line must PERSUADE, write it as polished prose, not a fragment. Match register to the job: internal strategy = dry, decisive, executive; customer-facing copy (PDP, landing page, ad hooks) = vivid and benefit-led while still grounded — copy good enough to ship as-is. Synthesize, don't just report: connect a persona pain to a spec to a proof point into one insight, provided every underlying fact is in the data. No AI throat-clearing, no sign-off.\n";
function progressChatSystem(){
  return ENGLISH_ONLY+FACTS_ONLY+WRITING_CRAFT+"You are the Black Voyage PRODUCT PROGRESS assistant for the Active Projects (manufacturing) board. "
   +"You ONLY help with: product progress, manufacturing status (Design → Sample → PPS → Bulk), suppliers/MOs, due dates and what's next, product specs, and quantities. "
   +"If asked about anything outside that — marketing, ads, copywriting, strategy, finance, or off-topic chit-chat — briefly decline and steer back to product / manufacturing progress. "
   +"Answer ONLY from the PROJECT DATA and PRODUCT SPECS below plus the user's question. NEVER invent a stage, status, date, supplier, MO, spec, or quantity that isn't in the data; if it isn't there, say so plainly and suggest who to ask. Be concise and concrete; use each product's real name.\n\n"
   +"PROJECT DATA (live, from the production sheet):\n"+progressDigest()+progressSpecDigest();
}
function pchatMsgsHTML(){ return PCHAT.msgs.map(m=>`<div class="pcmsg ${m.role==="user"?"user":"assistant"}"><b>${m.role==="user"?esc(m.who||"You"):"🏭 Progress AI"}</b><div>${esc(m.text)}</div></div>`).join("")+(PCHAT.busy?`<div class="pcmsg assistant"><b>🏭 Progress AI</b><div class="sub">thinking…</div></div>`:""); }
function renderPChat(){ const el=document.getElementById("pchatMsgs"); if(!el)return; el.innerHTML=pchatMsgsHTML(); el.scrollTop=el.scrollHeight; }
function progressChatHTML(){
  const open=(S.pchatOpen!==false);   // default OPEN so it's discoverable; collapses only when the user explicitly hides it
  const intro=`<div class="sub">Ask about where products stand — manufacturing stage, supplier / MO, due dates, what's next, specs, quantities. <span style="opacity:.8">e.g. “Which products are stuck in Sample?” · “What's overdue?” · “What stage is the Aero at and what's next?”</span></div>`;
  const body=open?`<div class="pcbody"><div id="pchatMsgs" class="pcmsgs" role="log" aria-live="polite">${PCHAT.msgs.length?pchatMsgsHTML():intro}</div>
      <div class="chatinput"><textarea id="pchatInput" placeholder="Ask about product progress, manufacturing, specs, quantity… (Enter to send)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();progressChatSend()}"></textarea><div class="cin-acts"><span class="cin-spacer"></span><button class="btn" onclick="progressChatSend()">Send</button></div></div></div>`:"";
  return `<div class="panel" style="margin-bottom:18px"><h3 style="cursor:pointer;margin:0" onclick="S.pchatOpen=!S.pchatOpen;render()">🏭 Ask about progress <span style="font-size:11px">${open?"▾":"▸"}</span> <span class="ghostnote pchat-tags" style="font-weight:400">· manufacturing · specs · quantity</span></h3>${body}</div>`;
}
async function progressChatSend(){
  const ta=document.getElementById("pchatInput"); if(!ta)return; const text=(ta.value||"").trim(); if(!text)return;
  if(PCHAT.busy){ if(PCHAT.busyAt&&(Date.now()-PCHAT.busyAt)>240000){ PCHAT.busy=false; } else { toast("Still working on the last question — one sec, then ask again."); return; } }
  ta.value=""; PCHAT.msgs.push({role:"user",who:actor(),text}); PCHAT.busy=true; PCHAT.busyAt=Date.now(); pchatSave(); renderPChat();
  const messages=PCHAT.msgs.slice(-12).map(m=>({role:m.role==="user"?"user":"assistant",content:String(m.text||"")}));
  let answer="";
  try{ const r=await chatFetch({model:chatModel(),system:progressChatSystem(),messages,tools:undefined,think:false},{timeout:120000,tries:2,toobigMsg:"That took too long — try asking about one product at a time."});
    if(r&&!r.error){ answer=(r.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("").trim(); }
    else { answer="⚠️ "+((r&&r.error&&r.error.message)||"the assistant backend hiccuped — please ask again."); }
  }catch(e){ answer="⚠️ "+String((e&&e.message)||"that didn't go through — please ask again."); }
  finally{ PCHAT.busy=false; PCHAT.busyAt=0; }
  PCHAT.msgs.push({role:"assistant",text:answer||"I didn't get an answer back — please ask again."}); pchatSave(); renderPChat();
}
