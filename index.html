<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Voyage — SuperPM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  /* ===== BLACK VOYAGE brand system (Brand Guidelines V4) =====
     Primary: Black #111215 · Orange #EE3124 (signal — use strategically)
     Neutrals: Silver #D0D5E1 · Aero White #F6F8FC
     Type: Aeonik (heading/paragraph) · IBM Plex Mono (labels) · rectangles + thin lines */
  :root{
    /* Spatial figure-ground: page sits BELOW its floating panels. Darker page + lighter/contrastier panels = cards visibly float on dark (the v2 tokens were too close in value to read as depth). */
    --bg:#0C0D10; --panel:#1C2029; --panel2:#20242C; --line:#363B45;
    --text:#F6F8FC; --dim:#ADB6C6; --faint:#7B8494;
    --accent:#EE3124; --green:#4ade80; --amber:#fbbf24; --red:#f87171; --blue:#60a5fa; --purple:#c084fc;
    --accent-glow:rgba(238,49,36,.42);    /* G3 signal glow on the primary action — theme-swapped in blue */
    --btntext:#fff;
    /* radius scale (Spatial Console v2) — soft geometry; precision reads through hairlines + alignment, not corners. */
    --r-xs:6px;   /* chips · pills · tags · status squares · progress bars */
    --r-sm:10px;  /* buttons · inputs · selects · rows · nav · tabs */
    --r-md:14px;  /* panels · cards · containers · popovers */
    --r-lg:20px;  /* floating tiles · the chat rail · modals · media wells */
    --r-pill:999px;
    /* depth layers + materials (DESIGN.md — Materials & Depth) */
    --void:#070809;                       /* deepest layer: canvas fields, hero moments */
    --edge:rgba(246,248,252,.18);         /* 1px top-inset light edge on floating surfaces */
    --sh-sm:0 3px 14px rgba(0,0,0,.45);   /* raised controls */
    --sh-md:0 16px 44px rgba(0,0,0,.58);  /* cards · popovers */
    --sh-lg:0 24px 64px rgba(0,0,0,.55);  /* modals · overlays */
    --g2:0 0 50px rgba(244,247,252,.05);  /* G2 neutral surface glow — slabs bloom on the dark field (never orange) */
    --trend-hot:#f87171;                  /* struggling-dept trend line; darkened in the light theme for contrast */
    --glass1:rgba(28,32,41,.78);          /* M1 frosted — panels/cards; translucent enough that field/glow reads, opaque enough for text */
    --glass2:rgba(20,23,29,.55);          /* M2 glass — overlays/menus/chat/header */
    --font-head:"Aeonik","Inter","Helvetica Neue",-apple-system,"Segoe UI",sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    /* Type scale — semantic, rem-based so it respects user zoom (1rem=16px → values match the prior px density exactly).
       Product-register: dense functional band (caption→body in ~1px steps) + a committed hierarchy jump (body→title→display ≈ 1.29×, 1.5×). */
    --fs-caption:0.6875rem; /* 11px · mono captions, legal, meta chips */
    --fs-meta:0.75rem;      /* 12px · column heads, secondary labels */
    --fs-sm:0.8125rem;      /* 13px · .sub, secondary body */
    --fs-body:0.875rem;     /* 14px · body base */
    --fs-title:1.125rem;    /* 18px · section h2 */
    --fs-lg:1.375rem;       /* 22px · dialog / auth h2 */
    --fs-display:1.6875rem; /* 27px · launch page hero title */
    --fs-hero:2.5rem;       /* 40px · display statements (weight 400 — no 300 weight is hosted; auth, empty states — one per surface max) */
    --lh-tight:1.12; --lh-snug:1.3; --lh-body:1.5;   /* leading roles */
  }
  [data-theme="light"]{
    --bg:#F6F8FC; --panel:#FFFFFF; --panel2:#ECEFF5; --line:#D0D5E1;
    --text:#111215; --dim:#4E5666; --faint:#8A93A3;
    --void:#E9EDF4; --edge:rgba(255,255,255,.85);
    /* Light elevation is its OWN system — NOT the dark theme's single black haze. Soft COOL-slate, LAYERED (tight contact + wide ambient) so white panels lift crisply on Aero White; low alpha reads as light air, not dirt. */
    --sh-sm:0 1px 2px rgba(17,24,39,.05),0 2px 8px rgba(41,50,72,.06); --sh-md:0 2px 6px rgba(17,24,39,.05),0 10px 26px rgba(41,50,72,.09),0 20px 44px rgba(41,50,72,.05); --sh-lg:0 4px 12px rgba(17,24,39,.07),0 22px 52px rgba(41,50,72,.13),0 40px 80px rgba(41,50,72,.08);
    --g2:0 0 0 rgba(41,50,72,0);   /* no surface bloom on white — the layered shadow carries depth; a dark glow here only double-hazes the panel (the old dirty-smudge halo) */
    --trend-hot:#dc2626;
    --glass1:rgba(255,255,255,.82); --glass2:rgba(255,255,255,.68);
  }
  /* cool dark-blue theme — dark base with blue glow */
  [data-theme="blue"]{
    --bg:#0D1320; --panel:#14203A; --panel2:#16213A; --line:#2A3A5C;
    --text:#E3EDFB; --dim:#92A8C7; --faint:#61748C;
    --void:#090E18; --edge:rgba(227,237,251,.12);
    --g2:0 0 50px rgba(120,170,255,.06);
    --glass1:rgba(18,26,43,.80); --glass2:rgba(13,19,32,.55);
    --accent:#3D8BFF;
    --accent-glow:rgba(61,139,255,.42);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* DESIGN.md — keyboard focus visible on every interactive element; mouse focus stays quiet */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
  button:focus:not(:focus-visible),summary:focus:not(:focus-visible){outline:none}
  /* DESIGN.md Motion — every animation has a reduced-motion alternative */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  }
  /* living atmosphere — blue-teal ambient glow that slowly drifts (Spatial Console v3, aligned to Fluxa reel).
     Lives on body::before (a STABLE element) so it animates smoothly and never restarts on #app re-render. */
  @keyframes ambientdrift{from{transform:translate3d(-1.5%,-1%,0) scale(1.02)}to{transform:translate3d(2%,1.5%,0) scale(1.09)}}
  body{background-color:var(--bg);background-image:radial-gradient(circle,rgba(246,248,252,.028) 1px,transparent 1.4px);background-size:26px 26px;color:var(--text);font:var(--fs-body)/var(--lh-body) var(--font-head);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-kerning:normal;font-optical-sizing:auto;font-variant-numeric:tabular-nums;}
  /* ambient depth glow — one neutral halo per view, behind content (fixed, non-interactive, z-index -1) */
  body::before{content:"";position:fixed;inset:-15%;pointer-events:none;z-index:-1;will-change:transform;animation:ambientdrift 26s ease-in-out infinite alternate;background:radial-gradient(1240px 860px at 86% 11%,rgba(61,139,255,.22),transparent 60%),radial-gradient(1080px 780px at 4% 98%,rgba(30,209,233,.15),transparent 58%)}
  [data-theme="light"] body::before{background:radial-gradient(1240px 860px at 86% 11%,rgba(61,139,255,.12),transparent 60%),radial-gradient(1080px 780px at 4% 98%,rgba(30,209,233,.09),transparent 58%)}
  [data-theme="light"] body{background-image:radial-gradient(circle,rgba(17,18,21,.035) 1px,transparent 1.4px);background-size:26px 26px}
  [data-theme="blue"] body{background-image:radial-gradient(circle,rgba(227,237,251,.03) 1px,transparent 1.4px);background-size:26px 26px}
  /* the auth overlay is opaque and above everything — carry the same ambient halo on its own background */
  #authgate{background:radial-gradient(1100px 700px at 85% -12%,rgba(246,248,252,.10),transparent 60%),radial-gradient(900px 640px at -10% 112%,rgba(246,248,252,.06),transparent 60%) var(--bg,#0e0e12)}
  [data-theme="light"] #authgate{background:radial-gradient(1100px 700px at 85% -12%,rgba(17,24,39,.05),transparent 62%),radial-gradient(900px 640px at -10% 112%,rgba(17,24,39,.03),transparent 60%) var(--bg)}
  h2{font-size:var(--fs-title);font-weight:700;letter-spacing:-.018em;line-height:var(--lh-snug);text-wrap:balance}
  /* mono-uppercase = the DATA voice (table heads, column heads, codes). Panel titles moved to sentence case (reference-driven). */
  .col h4,th{font-family:var(--font-mono);font-weight:400;text-transform:uppercase;letter-spacing:.08em}
  .stg,.o,.sla,.checkin .d,.feeditem .d{font-family:var(--font-mono)}
  /* light-theme component overrides */
  [data-theme="light"] .st.x{background:#E9F7EC;border-color:#3E9E5B;color:#1E7E3E}
  [data-theme="light"] .st.p{background:#FFF3E0;border-color:#D68910;color:#A05A00}
  [data-theme="light"] .st.b{background:#FDEAEA;border-color:#D64545;color:#B03030}
  [data-theme="light"] .ok{background:#E9F7EC;color:#1E7E3E} [data-theme="light"] .risk{background:#FFF3E0;color:#A05A00}
  [data-theme="light"] .bad{background:#FDEAEA;color:#B03030} [data-theme="light"] .done{background:#E8F0FE;color:#1A56B0}
  [data-theme="light"] .dec{background:#F3E8FD;color:#7A3FB8}
  [data-theme="light"] .urg.low{background:#E8F0FE;color:#1A56B0} [data-theme="light"] .urg.med{background:#FbF6DD;color:#8a7400}
  [data-theme="light"] .urg.high{background:#FFF0E0;color:#B25E00} [data-theme="light"] .urg.urgent{background:#FDEAEA;color:#B03030}
  [data-theme="light"] .lnk{background:#E8F0FE;color:#1A56B0} [data-theme="light"] .asg{background:#E8EDF6;color:#3C5A8A}
  [data-theme="light"] .stg.past{background:#E9F7EC;color:#1E7E3E;border-color:#bfe5c8}
  [data-theme="light"] .deptchip.rdy{background:#E9F7EC;color:#1E7E3E;border-color:#bfe5c8}
  [data-theme="light"] .flowwrap{background-color:rgba(238,241,247,.82);background-image:radial-gradient(760px 460px at 84% -8%,rgba(61,139,255,.06),transparent 60%),radial-gradient(640px 460px at -6% 106%,rgba(30,209,233,.05),transparent 60%),radial-gradient(circle,rgba(17,18,21,.055) 1px,transparent 1.4px);background-size:auto,auto,24px 24px}
  [data-theme="light"] .taskpanel{background:#EDF1F7;box-shadow:inset 0 1px 3px rgba(41,50,72,.06),inset 0 10px 22px -12px rgba(41,50,72,.10)}   /* recessed inner well in light — cool inset shadow, NOT the dark theme's black inner smudge */
  [data-theme="light"] .bar{background:#E3E8F1}
  body[data-wide] main{max-width:none}
  body[data-wide] footer{max-width:none!important}
  @keyframes glowPulse{0%,100%{opacity:1}50%{opacity:.2}}
  .glownode{animation:glowPulse 1.15s ease-in-out infinite}
  @keyframes bvShake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
  .bv-shake{animation:bvShake .45s cubic-bezier(.36,.07,.19,.97) both;will-change:transform}
  @media (prefers-reduced-motion:reduce){.bv-shake{animation:none}}
  @keyframes dashmove{to{stroke-dashoffset:-32}}
  .routeline{animation:dashmove 1.1s linear infinite}
  /* red dependency arrows — prominent (glow) + animated flow so the prerequisite→step→unblocks chain reads at a glance */
  .depedge{stroke-dasharray:7 5;filter:drop-shadow(0 0 2.5px rgba(238,49,36,.7));animation:dashmove 1s linear infinite}
  @media (prefers-reduced-motion:reduce){.depedge{animation:none;stroke-dasharray:none} .glownode{animation:none} .routeline{animation:none}}
  /* ── Flow-chart entrance choreography (Spatial Console v3 — DESIGN.md Motion) ──
     Plays ONCE per flow-view open (gated in flowSVG via .flowwrap.flowin); never on
     node-click / board-sync re-renders. Read: lane headers → nodes (fade+scale) →
     connectors (draw-in) → endpoint dots + cross links. All hidden/init state lives
     inside no-preference, so reduced-motion users get the finished static chart. */
  @keyframes flowHeadIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
  @keyframes flowNodeIn{from{opacity:0}to{opacity:1}}
  @keyframes flowEdgeDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes flowDotIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
  @keyframes flowCrossIn{from{opacity:0}to{opacity:.5}}
  @media (prefers-reduced-motion:no-preference){
    /* timing tuned so every channel's (max --d + duration) lands ≤600ms total (DESIGN.md Motion budget) */
    .flowwrap.flowin .flowhead{opacity:0;transform-box:fill-box;transform-origin:center;animation:flowHeadIn .30s var(--d,0ms) cubic-bezier(.16,1,.3,1) both}
    /* nodes fade opacity-ONLY: each node body carries a feDropShadow (filter:url(#nsh)); scaling the group would re-rasterize that filter every frame across ~15-20 simultaneous nodes. opacity composites after the filter, so no re-raster. */
    .flowwrap.flowin .flownode{opacity:0;animation:flowNodeIn .32s var(--d,0ms) cubic-bezier(.16,1,.3,1) both}
    .flowwrap.flowin .flowedge{stroke-dasharray:1;stroke-dashoffset:1;animation:flowEdgeDraw .28s var(--d,0ms) cubic-bezier(.16,1,.3,1) both}
    .flowwrap.flowin .flowdot{opacity:0;transform-box:fill-box;transform-origin:center;animation:flowDotIn .18s var(--d,0ms) ease-out both}
    .flowwrap.flowin .flowcross{animation:flowCrossIn .26s var(--d,0ms) ease-out both}
  }
  /* flow-node inline popover — replaces the full-width route banner; fixed so it escapes the chart's overflow (mirrors #summitTip) */
  /* node inspector — M2/M3 glass (real backdrop-blur; sits over the live canvas) */
  #flowPop{position:fixed;z-index:58;display:none;width:300px;max-width:92vw;max-height:calc(100vh - 24px);overflow:auto;background:rgba(22,25,31,.62);backdrop-filter:blur(26px) saturate(1.2);-webkit-backdrop-filter:blur(26px) saturate(1.2);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:inset 0 1px 0 var(--edge),var(--sh-lg);color:var(--text);font-size:12.5px;animation:fpIn .18s cubic-bezier(.16,1,.3,1)}
  [data-theme="light"] #flowPop{background:rgba(255,255,255,.82)}   /* the base is dark glass; on white the inspector needs a LIGHT glass or its var(--text) black copy sits on a dark panel (illegible) */
  @keyframes fpIn{from{opacity:0;transform:translateY(6px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
  .fn-sel{filter:drop-shadow(0 0 4px rgba(238,49,36,.55))}
  /* the head doubles as the drag handle — the popover otherwise parks itself over the routing lines it is explaining */
  .fp-head{display:flex;align-items:flex-start;gap:10px;padding:11px 12px 9px;border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  .fp-head:active{cursor:grabbing}
  .fp-head .fp-x,.fp-head .fp-x:active{cursor:pointer}
  #flowPop.fp-dragging{animation:none;cursor:grabbing;box-shadow:inset 0 1px 0 var(--edge),0 22px 60px rgba(0,0,0,.5)}
  .fp-h-main{flex:1;min-width:0}
  .fp-title{font-size:13px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
  .fp-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .fp-stage{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);border:1px solid var(--line);border-radius:2px;padding:1px 6px}
  .fp-dec{font-size:10.5px;color:var(--purple)}
  [data-theme="light"] .fp-dec{color:#7A3FB8}
  .fp-lock{font-size:10.5px;color:var(--faint)}
  .fp-x{flex:none;background:none;border:0;color:var(--faint);font-size:15px;line-height:1;cursor:pointer;padding:3px 5px;border-radius:2px}
  .fp-x:hover{color:var(--text);background:var(--panel2)}
  .fp-route{padding:9px 12px;color:var(--dim);line-height:1.5;border-bottom:1px solid var(--line)}
  .fp-route b{color:var(--text);font-weight:600}
  .fp-deps{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:7px}
  .fp-deplabel{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
  .fp-deplabel.fp-deplock{font-size:14px;letter-spacing:0}   /* lock / unlock icon replaces the verbose 等待 / 完成後解鎖 label */
  .fp-dep{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:1px 7px}
  .fp-dep.done{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
  .fp-dep.miss{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
  .fp-dep-o{font-size:9.5px;opacity:.72;font-family:var(--font-sans,inherit)}
  .fp-ownr{font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:2px;padding:1px 6px;white-space:nowrap}
  .fp-note{font-size:11.5px;color:var(--dim);line-height:1.5}
  .fp-note b{color:var(--text);font-weight:600;margin-right:4px}
  /* action bar — primary Complete verb lifted to the top, paired with the step's day estimate on the right */
  .fp-actbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .fp-actbar{flex-wrap:wrap}
  /* 動作鈕不准換行也不准被日期欄擠扁；min-width 讓「✓ 標記完成 / ↩ 重新開啟 / ◆ 核准 / ↩ 撤銷核准」
     四種狀態同寬，切換狀態時彈窗不會忽寬忽窄。 */
  .fp-actbar .btn{padding:7px 14px;font-size:12px;white-space:nowrap;flex:none;line-height:1.25}   /* 固定 line-height：↩ 比 ✓／◆ 高，讓整條動作列在切換狀態時上下跳 2px */
  /* 固定尺寸：四種狀態（標記完成／重新開啟／◆ 核准／撤銷核准）的按鈕必須一模一樣大，切換時整條列不能跳。
     光靠 line-height 壓不住 —— ↩ 會被當成 emoji 拿到比較高的字框，所以高度直接寫死。 */
  .fp-actbar .fp-mark{min-width:106px;height:31px;display:inline-flex;align-items:center;justify-content:center;padding-block:0}
  .fp-act-note{font-size:11px;color:var(--dim)}
  .fp-days{font-family:var(--font-mono);font-size:10.5px;color:var(--dim);border:1px solid var(--line);background:var(--panel2);border-radius:var(--r-xs);padding:3px 8px;white-space:nowrap;flex:none}
  .fp-days.tbd{color:var(--red);border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.1)}   /* estimate not typed yet → soft-red, matches the days-pending flags */
  .fp-days-edit{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;cursor:text;transition:border-color .15s ease,background .15s ease}
  .fp-days-edit:focus-within{border-color:var(--accent);background:var(--panel2)}
  .fp-days-edit input{width:34px;background:transparent;border:none;color:inherit;font-family:var(--font-mono);font-size:11px;text-align:right;padding:0;-moz-appearance:textfield}
  .fp-days-edit input[type=date]{width:auto;text-align:left;cursor:pointer}
  .fp-days-edit input:focus{outline:none}
  .fp-days-edit input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .fp-days-edit input::placeholder{color:currentColor;opacity:.65}
  .fp-days-u{opacity:.7}
  /* the 4 add-link buttons sit as an aligned 2×2 grid (was a ragged 3+1 wrap); existing link/code chips span full width above them */
  .fp-linkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:4px}
  .fp-linkgrid>*:not(.addlnk){grid-column:1/-1;margin-left:0}
  .fp-linkgrid .addlnk{margin-left:0;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:3px;padding:7px 6px;font-size:11px;white-space:nowrap}
  .fp-dep::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dc,var(--faint));flex:none}
  .fp-sec{padding:10px 12px;border-bottom:1px solid var(--line)}
  .fp-daterow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fp-date-note{font-size:11px;color:var(--faint);flex:1;min-width:120px}
  .fp-lab{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:8px}
  .fp-links{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;max-height:150px;overflow:auto}
  .fp-lnk{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:2px;padding:3px 4px 3px 8px}
  .fp-lnk a{flex:1;min-width:0;color:var(--blue);text-decoration:none;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fp-lnk a:hover{text-decoration:underline}
  [data-theme="light"] .fp-lnk a{color:#1A56B0}
  .fp-lnkx{flex:none;background:none;border:0;color:var(--faint);cursor:pointer;font-size:12px;line-height:1;padding:2px 4px;border-radius:2px}
  .fp-lnkx:hover{color:var(--red);background:var(--panel)}
  .fp-empty{color:var(--dim);font-size:11.5px}
  .fp-addrow{display:flex;gap:6px}
  .fp-in{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:2px;color:var(--text);font:inherit;font-size:12px;padding:5px 8px}
  .fp-in::placeholder{color:var(--faint)}
  .fp-in:focus{outline:none;border-color:var(--accent)}

  /* launch-detail header — project identity: title · DRI · grouped actions · scannable stats */
  /* 捲過標題後浮現的迷你列（返回鍵＋產品名＋健康＋動作鈕），讓「我在哪張卡、怎麼回去」不會消失。
     ⚠ 這裡刻意用 position:FIXED，不要改回 sticky＋收合。前一版是把頁首本體做成 sticky、黏住時
     收合成一條：元素高度 62px→46px，而它就在捲動點的正上方，Chrome 的 scroll anchoring 會反過來
     把 scrollY 減 16px 補償版面 → 又退回門檻之外 → 撐開 → scrollY 再被推回，無限來回，畫面狂閃

/* ================= TEAM CONFIG (editable in Team tab — no names, departments only) ================= */
let TEAM = [
 {name:"Product",  role:"Owns the product: intake form, market research, concept, prototyping, costing, design freeze, pre-production sample + BOM, mass production."},
 {name:"Design",   role:"Two owners: Oume runs everything PDP (draft, official PDP + infographics, the live swap); Mi runs identity, packaging / insert / manual and the studio-shoot brief."},
 {name:"Catalog",  role:"Shopify product & SKU creation, factory order, COGS & bundle setup, catalog site, product data filing."},
 {name:"Content",  role:"Shoot requirements & plan, product / lifestyle shoot, marketing video, post-production."},
 {name:"Social",   role:"Channel posts: IG / YouTube / TikTok."},
 {name:"Marketing",role:"Product marketing brief, KOL / influencer engine (MOAT · ASMR · Cinematic · Authority · Reach · Seed · UGC · Pro), evaluation loop."},
 {name:"Ads",      role:"Ad post-production, partnerships approval, paid campaigns."},
 {name:"Email",    role:"Launch & campaign email sequences."},
 {name:"CRM",      role:"Influencer DM routing → email pipeline, relationship records."},
 {name:"Logistics",role:"Freight: sea bulk + air samples; warehouse readiness."},
];
TEAM.forEach(t=>{t.head=t.head||"";t.members=t.members||"";});
/* ================= PEOPLE CONFIG (負責人) =================
   TEAM above is the DEPARTMENT layer — it owns the flow-chart lanes, the dept colours and the sign-in
   lens. PEOPLE is the layer the workflow actually talks in: every V3 node's `o` field and the Settings →
   Workflow template picker name a person from this list, and the by-phase progress list shows these
   names instead of the lane. `dept` links a person back to a TEAM row so an email listed here still
   resolves to that person's department lens. Roles are NOT written by hand — Settings derives each
   person's responsibilities from the steps they own, so the list can never drift from the flow. */
let PEOPLE = [
 {name:"Ben",     dept:"Product",   emails:"ben@blackvoyage.com, hello@blackvoyage.com"},
 {name:"Zac",     dept:"Product",   emails:""},
 {name:"Oume",    dept:"Design",    emails:""},
 {name:"Mi",      dept:"Design",    emails:""},
 {name:"Ann",     dept:"Marketing", emails:""},
 {name:"Angel",   dept:"CRM",       emails:""},
 {name:"LC",      dept:"Logistics", emails:""},
 {name:"各攝影師", dept:"Content",   emails:""},
];
const PEOPLENAMES=()=>PEOPLE.map(p=>p.name);
// DEPTS() = the departments that actually own V3 flow work, in flow-chart lane order (FLOW's key order is
// seeded from V3DEPTS by v3Rederive). TEAM may carry extra rows (Social / Ads / Email have no V3 node since
// SM1·SM2·ADS1·EM1 were cut) — those must not appear in dept statistics, pickers or the pulse heat-map, or
// every stats view carries three permanently-empty rows. ALLDEPTS() is the raw people-config list for the
// places that must still see every team (sign-in lens switcher, free-form campaign tasks, the Team tab).
const ALLDEPTS = () => TEAM.map(t=>t.name);
const DEPTS = () => Object.keys(FLOW);

/* ================= STAGES & GATE MAP (from gate-map v1) ================= */
/* ================= THE LAUNCH FLOW — V3 (Shopify) · source of truth: FLOW-V3.md =================
   ONE flow, trigger-based (a req DAG). Everything the UI shows — portfolio columns, the card's
   stage list, the flow-chart lanes, the gates — is DERIVED below from V3 + V3PH, so this array is
   the single place to edit the flow. Fields per node:
     c   stable code (=task.code)      en/zh  bilingual display name (EN base + ZH via dict)
     ph  phase index into V3PH         dept   flow-chart lane (department)   o  owner (real person)
     days  number=fixed · null=manual per-launch · 0=milestone/event   ref/est  manual-day hint/estimate
     req  [codes that must finish first] — the unlock gating (cross-lane, cross-phase)
     ben  ◆ Ben decision   asset  feeds the readiness dashboard   out/note  ▸產出 / *備註 ({en,zh})
     evid  a proof link must be attached before it can be ticked done (EVID below is derived from this)
     sample  P3 carries the 預計大貨樣日 field that gates P5
   STAGES/PLAN are code-only (never snapshotted); GATES/FLOW/XROUTES are re-derived from V3 by
   v3Rederive() inside applySnapshot, so editing V3 here needs NO migration. */
const V3PH=[
 {en:"Concept & Design", zh:"概念＆設計"},
 {en:"Prototype & Delivery", zh:"打樣＆交付"},
 {en:"Launch Prep", zh:"上市準備"},

 {en:"Logistics", zh:"物流"},

 // 舊卡 history 裡的死階段名由 v3SyncTasks 就地併回前一段，不會殘留在時間軸／延遲統計裡。
];
const V3=[
 // 0 — Concept & Design
 {c:"C1", en:"Form (intake)", zh:"產品需求表", ph:0, dept:"Product", o:"Ben", days:0, req:[]},
 {c:"C2", en:"Understand WHY", zh:"概念轉化", ph:0, dept:"Product", o:"Zac", days:1, req:["C1"]},
 {c:"C3", en:"Market research", zh:"市場調查", ph:0, dept:"Product", o:"Zac", days:5, req:["C2"]},
 {c:"C4", en:"Distill", zh:"萃取", ph:0, dept:"Product", o:"Zac", days:2, req:["C3"], out:{en:"PPT / Figma",zh:"PPT or Figma"}, isNew:1},
 {c:"C5", en:"Brainstorming", zh:"腦力激盪", ph:0, dept:"Product", o:"Zac + Oume + Mi", days:2, req:["C4"], out:{en:"meeting",zh:"會議"}},
 {c:"C6", en:"Design integration", zh:"整合設計", ph:0, dept:"Product", o:"Zac", days:4, req:["C5"], out:{en:"PPT/Figma + model name + brand language",zh:"PPT／Figma＋型號名稱＋品牌語言確認"}, isNew:1},
 {c:"D1", en:"Identity design", zh:"識別設計", ph:0, dept:"Design", o:"Mi", days:7, req:["C5"], out:{en:"packaging, label…",zh:"Packaging、Label…"}, note:{en:"starts when design integration (C6) starts",zh:"整合設計（C6）一開始就同步製作"}, isNew:1},
 {c:"C7", en:"Ben concept sign-off", zh:"Ben 決策", ph:0, dept:"Product", o:"Ben", days:5, req:["C6","D1"], ben:1, out:{en:"Yes / No",zh:"Yes or No"}, note:{en:"needs BOTH design integration and identity design done",zh:"整合設計＋識別設計都完成才決策"}},
 // 1 — Prototype & Delivery
 {c:"C8", en:"Prototyping", zh:"原型打樣", ph:1, dept:"Product", o:"Zac", days:null, req:["C7"], out:{en:"prototype",zh:"原型"}, note:{en:"cost sheet lives here (negotiated during sampling)",zh:"成本表貼於此（打樣期間來回議定成本）"}},
 {c:"C9", en:"Ben prototype sign-off", zh:"Ben 決策", ph:1, dept:"Product", o:"Ben", days:11, req:["C8"], ben:1, out:{en:"Yes / No",zh:"Yes or No"}, note:{en:"ship 9 + decide 2",zh:"運輸 9＋決策 2"}},
 {c:"C10", en:"Design freeze", zh:"設計凍結", ph:1, dept:"Product", o:"Zac + Ben", days:0, req:["C9"], out:{en:"freeze data = product data filing (feeds MB1)",zh:"凍結資料＝產品資料建檔（供 MB1）"}},
 {c:"P1", evid:1, en:"Pre-production sample + BOM", zh:"產前樣＆BOM", ph:1, dept:"Product", o:"Zac", days:14, req:["C10"], out:{en:"to Taiwan + BOM filed",zh:"送台灣＆BOM 歸檔"}, note:{en:"make 7 + ship 7",zh:"製作 7＋運輸 7"}},
 // 大貨生產不掛 evid：產線進度靠天數與大貨樣日追蹤，沒有一份「證明連結」可附（QC 報告是選配，不該擋完工）
 {c:"P3", en:"Mass production", zh:"大貨生產", ph:1, dept:"Product", o:"Zac", days:null, req:["P1"], sample:1, out:{en:"day countdown",zh:"天數倒數"}, note:{en:"packaging (D3) to factory during production",zh:"包裝檔（D3）於生產期間交廠"}},
 // 2 — Launch Prep
 {c:"P2", en:"Product intro video", zh:"產品介紹", ph:2, dept:"Product", o:"Zac", days:1, req:["P1"], asset:1, out:{en:"quick how-to video → whole company",zh:"簡單操作影片 → 全公司"}, isNew:1},
 {c:"CT1", en:"Factory order created", zh:"工廠訂單建立", ph:2, dept:"Catalog", o:"Zac", days:1, req:["P1"], note:{en:"do at P3 start (= P1 done)",zh:"大貨生產開啟（＝P1 完成）即做"}},
 {c:"CT2", en:"Catalog site updated", zh:"目錄網站更新", ph:2, dept:"Catalog", o:"Zac", days:1, req:["MB1"], note:{en:"opens alongside MB1 finalized",zh:"行銷簡報 V1 結束後同步開啟"}},

const v3StartClock=(l,vn)=>{const reqs=(vn&&vn.req)||[];
  if(!reqs.length)return (l.history&&l.history[0]&&l.history[0].start)||null;
  let latest=null; for(const rc of reqs){const rt=v3Task(l,rc); if(!rt||rt.st!=="x"||!rt.doneAt)return null; if(!latest||rt.doneAt>latest)latest=rt.doneAt;} return latest;};

  if(!v){v3SetDays(slug,i,"");return;}
  const vn=t.code&&V3MAP[t.code], sc=vn?v3StartClock(l,vn):null;

// 倒推紅旗: remaining calendar-days estimate to finish `code` = longest unmet req chain (memoized by VALUE —
// a plain visited-set would zero out shared upstreams on diamond deps like D6←D5-chain vs D6←MS3b-chain)
function v3EstRemain(l,code,memo){
  memo=memo||{}; if(code in memo)return memo[code];
  memo[code]=0; // cycle guard (template is a DAG; this only matters if a bad edit ever loops it)
  const t=v3Task(l,code); if(!t||t.st==="x")return 0;
  const n=V3MAP[code]; if(!n)return 0;
  const own=(t.days!=null?t.days:(n.est!=null?n.est:(n.ref?parseInt(n.ref,10)||0:0))); // est = numeric estimate when ref isn't parseable (e.g. P5 "空9／海21" → est 9)
  let pre=0; (n.req||[]).forEach(r=>{pre=Math.max(pre,v3EstRemain(l,r,memo));});
  return memo[code]=own+pre;
}

function v3SyncTasks(l){

  // 動過任何一筆算進行中；證明連結彙整。舊碼不在模板裡，rebuild 會自然丟棄，這裡只負責把歷史帶進新格。
  if(!byCode.KOL&&V3MAP.KOL){ const olds=l.tasks.filter(t=>t&&["KOL1","KOL2","KOL3","KOL4","KOL5"].indexOf(t.code)>=0);
    if(olds.length){ const m=v3NewTask(V3MAP.KOL);
      m.st=olds.every(t=>t.st==="x")?"x":(olds.some(t=>t.st==="b")?"b":(olds.some(t=>t.st!=="o")?"p":"o"));
      olds.forEach(t=>(t.links||[]).forEach(k=>m.links.push(k)));

      const st0=olds.map(t=>t.startAt).filter(Boolean).sort(); if(st0.length&&m.st!=="o")m.startAt=st0[0];
      byCode.KOL=m; } }

    const t=old||v3NewTask(n);

    if(!("days" in t)||(old&&old.days===undefined)) t.days=(n.days==null?null:n.days);
    t.st=t.st||"o"; t.links=t.links||[]; t.codes=t.codes||[]; t.notes=t.notes||[]; t.urg=t.urg||"med"; if(t.assignee==null)t.assignee="";

  // plan=0 且已無任務掛該階段（unk=0），整段天數會被誤算成逾期灌進延遲趨勢。
  if(Array.isArray(l.history)&&l.history.length){ let lastOk="";
    l.history=l.history.filter(h=>{ if(STAGES.indexOf(h.stage)>=0){ lastOk=h.stage; return true; }

function syncProjected(l){ if(!l||l.complete)return; const p=projLaunchDate(l); if(!p)return; l.target=p;   // l.target 鏡射預計上市日
  // 基準上市日：C1 送出當下的預計上市日凍結一次，之後 float／預估延遲都對它量測（既有卡在此一次性補存）
  if(!l.baselineTarget&&formSubmitDate(l))l.baselineTarget=p; }
/* 上市日的定義端點：FB1（大貨到貨＝首波開賣）、D6（正式 PDP）、MS3b（行銷影片）。沿 req 正向可達其中之一 ⇒
   這個步驟的天數會參與預計上市日的推算（未填就當 0，日期偏早）；不可達 ⇒ 影響「未知」，絕不可寫成「不影響
   上市日」。MS3b 是 2026-07-31 D6 拿掉 MS3b 前置後補進來的：影片不再餵給任何人，但它仍是上市前要交出的素材，
   而且實際上就是排程最尾巴的節點（projLaunchDate 取全圖最大完成日）—— 不列為端點的話，真正決定上市日的那一步
   會被標成「不影響上市日」。 */
const V3LAUNCH_ENDS=["FB1","D6","MS3b","UL6"];   // launch 的三個端點＋update 模板的單一終點（req 不跨模板,聯集圖仍各走各的）
const v3AffectsLaunch=(()=>{ const memo={};
  const walk=c=>{ if(c in memo)return memo[c]; memo[c]=false;                       // 先寫 false＝循環守衛（模板是 DAG）
    return memo[c]=V3LAUNCH_ENDS.indexOf(c)>=0||V3ALL.some(m=>(m.req||[]).indexOf(c)>=0&&walk(m.c)); };
  return c=>walk(c); })();
// days:null 且未填的任務：miss＝無 est 退路（當 0 天算，必填）；soft＝有 est 預設可頂著（建議確認）。
// aff＝天數會走進上市日推算。ongoing 節點（KOL 全線）設計上就沒有天數，不列待補。
function v3PendingDays(l){
  const miss=[], soft=[];
  tplNodes(l).forEach(n=>{ if(n.days!=null||n.ongoing)return; const t=v3Task(l,n.c); if(!t||t.st==="x"||t.days!=null)return;
    (n.est!=null?soft:miss).push({code:n.c, t:t.t, d:v3Dept(n), aff:v3AffectsLaunch(n.c)}); });
  const rank=(a,b)=>(b.aff-a.aff);
  return {miss:miss.sort(rank), soft:soft.sort(rank), nAff:miss.filter(r=>r.aff).length};
}
// per-department health: planned-day budget vs actual elapsed vs remaining, a RAG status, and whether
// the dept sits on the critical path. Actual comes from TASK-level stamps (startAt/doneAt) — the old
// stage-history apportionment handed actual=0 to every dept whose work sits in a phase with no history
// segment, so a dept with 5 逾期步驟 read「準時」. 一步都沒開工 ⇒ actual null ⇒ UI 印「—」，不是準時。
function v3DeptHealth(l){
  const sched=v3Schedule(l), cp=new Set(v3CriticalPath(l)), depts={};
  tplNodes(l).forEach(n=>{
    const t=v3Task(l,n.c); if(!t)return;
    const dp=v3Dept(n); const g=depts[dp]||(depts[dp]={dept:dp,budget:0,actual:0,remain:0,done:0,total:0,late:0,onCP:false,blocked:false});
    g.budget+=taskDayLimit(t)||0; g.total++;
    if(cp.has(n.c))g.onCP=true;
    if(t.st==="b")g.blocked=true;
    if(t.st==="x")g.done++;
    // 逾期只算「已解鎖」的步驟：前置沒完成的步驟根本不能動，把它算成擁有者的落後會把瓶頸指到被卡住的下游部門
    const s=sched[n.c]; if(t.st!=="x"&&s&&s.plannedEnd<today&&!taskLocked(l,t))g.late++;
  });
  Object.keys(depts).forEach(d=>{ let act=0,bud=0,started=0;
    // actual 與 budget 只累計「已開工的步驟」，比才是同一把尺；天數未知的步驟兩邊都不計（沒填 ≠ 0 天）。
    (l.tasks||[]).forEach(t=>{ if(!t.code||t.d!==d||taskDaysUnknown(t))return;
      const lim=taskDayLimit(t)||0;
      if(t.st==="x"){ started++; bud+=lim; act+=(t.startAt&&t.doneAt)?Math.max(0,dayDiff(t.startAt,t.doneAt)):lim; }   // 完成卻沒時間戳 ⇒ 以預算計（中性），別當 0 天
      else if(t.startAt){ started++; bud+=lim; act+=Math.max(0,dayDiff(t.startAt,today)); } });
    const g=depts[d]; g.actual=started?Math.round(act):null; g.budgetSoFar=Math.round(bud); g.remain=Math.max(0,g.budget-(g.actual||0));
  });
  return Object.values(depts).map(g=>{
    const base=g.budgetSoFar||g.budget, ratio=(g.actual!=null&&base)?g.actual/base:0;
    let status;
    // 全做完的部門不可能是瓶頸 —— 完工先判，否則 ratio>1.1 會把 4/4 的部門標成「落後」並排到最前面
    if(g.total&&g.done===g.total) status=(g.actual!=null&&g.actual<base*0.95)?"ahead":"done";
    else if(g.blocked||g.late) status="behind";        // 已逾期的步驟就是落後，不必等 ratio（沒開工的步驟不會累積 actual）
    else if(g.actual==null) status="nodata";           // 一步都還沒開工：無從比較
    else status=ratio>1.1?"behind":"ontrack";
    return {...g,ratio,status};
  }).sort((a,b)=>{const rk=s=>s.status==="behind"?0:s.status==="ontrack"?1:s.status==="nodata"?2:s.status==="ahead"?3:4;
    return (rk(a)-rk(b))||(b.onCP-a.onCP)||(b.late-a.late)||(b.ratio-a.ratio)||(b.budget-a.budget);});
}
// one-line verdict: overall slip + the bottleneck dept (a behind dept on the critical path, else the worst behind dept).
function v3Narrative(l){
  const zh=LANG==="zh";
  if(l.complete)return zh?"已完成上市。":"Launch complete.";
  if(!isSubmitted(l))return zh?("需求表（"+tplIntake(l)+"）還沒送出,排程尚未起算。"):("Intake form ("+tplIntake(l)+") not submitted — scheduling hasn't started.");
  const slip=projectedSlip(l), dh=v3DeptHealth(l), behind=dh.filter(g=>g.status==="behind");
  const bott=behind.find(g=>g.onCP)||behind[0], dn=bott?bott.dept:"";
  if(slip>0)return (zh?`預計比基準晚 ${slip} 天上市`:`Projected ${slip}d later than baseline`)+(bott?(zh?`,瓶頸在 ${dn}`:`, bottleneck: ${dn}`):"");
  if(bott)return zh?`整體在排程內,但 ${dn} 落後,留意別波及關鍵路徑`:`On schedule overall, but ${dn} is behind — watch the critical path`;
  const fl=floatDays(l);
  return fl>0?(zh?`順利,比基準早 ${fl} 天`:`On track — ${fl}d ahead of baseline`)
             :(zh?"順利,與基準上市日一致":"On track — on the baseline date");
}
// jump to the most-actionable open task in a department (blocked → in-progress → next unlocked → first open).
function v3jumpDept(slug,dept){
  const l=L(slug); if(!l)return;
  const inDept=(l.tasks||[]).filter(t=>t.d===dept); if(!inDept.length)return;
  const open=inDept.filter(t=>t.st!=="x");
  // blocked → in-progress → next unlocked → first open → (all done) last task in the dept, so the click always lands somewhere
  const pick=open.find(t=>t.st==="b")||open.find(t=>t.st==="p")||open.find(t=>!taskLocked(l,t))||open[0]||inDept[inDept.length-1];
  jumpTask(slug,l.tasks.indexOf(pick));
}

/* ================= SUPER PM ENGINE ================= */
const SLA_DAYS=2, WIP_LIMIT=4;
const LOG=[{d:"2026-06-10 08:00",m:"SuperPM fork initialized from Tracker v2"}];
function log(m){LOG.unshift({d:today+" "+String(8+LOG.length%9).padStart(2,"0")+":"+String(LOG.length*7%60).padStart(2,"0"),m}); if(LOG.length>250)LOG.pop(); save();}
function floatDays(l){ if(l.complete) return 0;   // 正＝比基準早，負＝比基準晚（絕對值＝projectedSlip）；沒基準日可比就是 0
  const b=l.baselineTarget, p=projLaunchDate(l);
  return (b&&p)?dayDiff(p,b):0;
}
function velocity(l){ const weeks=Math.max(1,dayDiff(l.history[0].start,today)/7);
  return l.tasks.filter(t=>t.st==="x").length/weeks; }
function forecastDate(l){ if(l.complete) return l.target;
  const rem=l.tasks.filter(t=>t.st!=="x").length; const vpd=Math.max(velocity(l)/7,0.05);
  return v3AddD(today,Math.ceil(rem/vpd)); }
// 本階段的未鎖關卡條件優先；本階段全鎖住時，退回全卡第一個未鎖未完成的步驟（跨相：真正該催的通常在下一相），
// 兩者都沒有才回第一個未完成（全部被鎖 ⇒ 這張卡在等別人）。
function criticalNext(l){
  const c=gateState(l).cs.find(c=>c.task&&c.task.st!=="x"&&!taskLocked(l,c.task));
  if(c) return {t:c.t,d:c.d};
  const t=(l.tasks||[]).find(t=>t.st!=="x"&&!taskLocked(l,t));
  if(t) return {t:t.t,d:t.d};
  const any=nextUnmetC(l); return any?{t:any.t,d:any.d}:null;
}
// which department progress is currently sitting with — derived from the next unmet gate criterion, NOT a manually-chosen DRI
// progressDept()（單一「目前在」部門）已由 v3CpNow＋v3BallChips 取代（2026-08-13）——單點指標會把並行讀成「全卡在一個部門」
const wip=d=>LAUNCHES.filter(l=>!l.complete).reduce((a,l)=>a+l.tasks.filter(t=>t.d===d&&t.st==="p").length,0);
// keyed by CODE (syncDecisionReq writes it) — titles drift with the template, codes don't
const decisionAge=(l,c)=>{const d=(l.decisionRequested||{})[c]; return d?Math.max(0,dayDiff(d,today)):0;};

function autopilot(){ // the auto-correct brain: detect → propose → one-click (or bulk) fix
  const issues=[];
  benQueue().forEach(({l,c})=>{const age=decisionAge(l,c.code); const br=age>SLA_DAYS;
    issues.push({sev:br?"red":"amber",msg:`◆ ${l.name} — “${c.t}” waiting ${age}d${br?" (SLA "+SLA_DAYS+"d breached)":""}`,
      fixLabel:"Escalate",fix:br?()=>{c.urg="urgent"; c.escalatedAt=today;   // escalatedAt = 有沒有催過的唯一憑據（存在 task 上，隨 LAUNCHES 一起序列化）
        l.checkins.unshift({d:today,a:"Autopilot",txt:`Escalated “${c.t}” — decision SLA breached (${age}d); flagged for Ben in the decision queue.`});
        log("⚡ Escalated "+l.name+" ◆ gate (SLA breach)");}:null});});
  LAUNCHES.filter(l=>!l.complete).forEach(l=>{
    const last=l.checkins[0], staleD=last?dayDiff(last.d,today):99;
    if(staleD>7) issues.push({sev:"amber",msg:`📝 ${l.name}: check-in ${staleD}d old`,fixLabel:"Nudge DRI",
      fix:()=>{l.checkins.unshift({d:today,a:"Autopilot",txt:`Auto-nudge sent to DRI (${l.dri}) — weekly check-in overdue.`});log("⚡ Nudged "+l.name+" DRI");}});
    l.tasks.filter(t=>t.st==="b").forEach(t=>issues.push({sev:"red",msg:`⛔ ${l.name}: “${t.t}” blocked (${t.d})`,fixLabel:"Escalate",
      fix:t.urg!=="urgent"?()=>{t.urg="urgent";l.checkins.unshift({d:today,a:"Autopilot",txt:`Escalated blocked “${t.t}” to urgent; Director alerted.`});log("⚡ Escalated blocked task on "+l.name);}:null}));
    l.tasks.filter(t=>t.st==="x"&&EVID.has(t.code)&&!(t.links||[]).length).forEach(t=>issues.push({sev:"amber",
      msg:`📎 ${l.name}: “${t.t}” marked done without evidence`,fixLabel:"Reopen",
      fix:()=>{t.st="p";l.checkins.unshift({d:today,a:"Autopilot",txt:`Reopened “${t.t}” — evidence link missing (playbook rule).`});log("⚡ Reopened "+l.name+" / "+t.t);}}));
    // 比基準晚才報，且必須修得掉：舊模型（階段預算相加）對每張活躍卡都報一筆 fix:null 的紅字，永遠清不掉＝噪音
    const fl=floatDays(l), bt=l.baselineTarget;
    if(fl<0&&bt) issues.push({sev:fl<-7?"red":"amber",
      msg:LANG==="zh"?`📉 ${l.name}：預計上市 ${fmt(l.target)} 比基準 ${fmt(bt)} 晚 ${-fl} 天`
                     :`📉 ${l.name}: projected ${fmt(l.target)} is ${-fl}d later than the ${fmt(bt)} baseline`,
      fixLabel:LANG==="zh"?"重設基準":"Rebaseline",
      fix:()=>{l.baselineTarget=l.target;
        l.checkins.unshift({d:today,a:"Autopilot",txt:LANG==="zh"
          ?`基準上市日重設為 ${fmt(l.target)}（原 ${fmt(bt)},延後 ${-fl} 天）—— 之後的 Float／預估延遲對新基準量測。`
          :`Baseline launch date reset to ${fmt(l.target)} (was ${fmt(bt)}, ${-fl}d later) — float/slip now measure against it.`});
        log("⚡ Rebaselined "+l.name+" → "+l.target);}});
  });
  DEPTS().forEach(d=>{const w=wip(d); if(w>WIP_LIMIT) issues.push({sev:"amber",msg:`🌊 ${d}: WIP ${w} over limit ${WIP_LIMIT}`,fix:null});});
  return issues;
}
function autoFixAll(){ let n=0; autopilot().forEach(i=>{if(i.fix){i.fix();n++;}});
  toast(n?`⚡ Auto-corrected ${n} issue(s) — all logged`:"✨ Nothing to fix"); render(); }

/* ----- portfolio health score (0–100) ----- */
function healthScore(){
  let s=100; const act=LAUNCHES.filter(l=>!l.complete);
  act.forEach(l=>{
    s-=l.tasks.filter(t=>t.st==="b").length*8;
    if(floatDays(l)<0)s-=15;
    const last=l.checkins[0]; if(!last||dayDiff(last.d,today)>7)s-=5;
  });
  benQueue().forEach(({l,c})=>{if(decisionAge(l,c.code)>SLA_DAYS)s-=12;});
  DEPTS().forEach(d=>{if(wip(d)>WIP_LIMIT)s-=5;});
  return Math.max(10,Math.min(100,s));
}
const grade=s=>s>=90?"A":s>=80?"B":s>=70?"C":s>=55?"D":"F";
function gaugeSVG(s){const R=42,C=2*Math.PI*R,f=s/100;
  const col=s>=80?"#4ade80":s>=60?"#fbbf24":"#f87171";
  return `<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="${R}" fill="none" stroke="#1d2127" stroke-width="11"/>
  <circle cx="55" cy="55" r="${R}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round"
    stroke-dasharray="${(C*f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 55 55)"/>
  <text x="55" y="52" text-anchor="middle" fill="${col}" font-size="24" font-weight="700">${s}</text>
  <text x="55" y="70" text-anchor="middle" fill="#9aa3ad" font-size="11">grade ${grade(s)}</text></svg>`;}

/* ----- weekly digest (paste into Slack) ----- */
function buildDigest(){
  const lines=[`*BV PORTFOLIO DIGEST — week of ${fmt(today)}*`,""];
  LAUNCHES.filter(l=>!l.complete).forEach(l=>{
    const g=gateState(l),[h]=health(l),cn=criticalNext(l);
    lines.push(`*${l.name}* — ${l.stage} (${g.met}/${g.total} gate criteria) · ${h}`);
    lines.push(`  DRI ${l.dri} · target ${fmt(l.target)} · float ${floatDays(l)}d · forecast ${fmt(forecastDate(l))}`);
    if(cn) lines.push(`  → critical next: ${cn.t} (${cn.d})`);
    l.tasks.filter(t=>t.st==="b").forEach(t=>lines.push(`  ⛔ blocked: ${t.t} (${t.d})`));
    lines.push("");
  });
  const q=benQueue();
  if(q.length){lines.push(`*◆ DECISIONS WAITING ON BEN (SLA ${SLA_DAYS}d)*`);
    q.forEach(({l,c})=>lines.push(`  • ${l.name} — ${c.t} (${decisionAge(l,c.code)}d)`)); lines.push("");}
  const iss=autopilot();
  lines.push(`*AUTOPILOT* — ${iss.length} open issue(s), health score ${healthScore()}/100 (${grade(healthScore())})`);
  const z=LAUNCHES.filter(l=>l.complete);
  if(z.length)lines.push(`\n_Complete: ${z.map(l=>l.name).join(", ")}_`);
  return lines.join("\n");
}

/* ----- create a Drive folder for a launch, inside the shared "BV SuperPM" folder -----
   Called from newLaunch(). Best-effort: if Google isn't configured/signed-in, the card is
   still created locally and we just skip (or surface a hint). The folder id is stored on the
   launch so every Sheet/Doc generated for it lands inside its own folder. */
function createLaunchFolder(slug,_tries){
  const l=L(slug); if(!l)return;
  if(!GOOGLE_CLIENT_ID)return;            // Google not configured → skip silently, card already created
  if(l.driveFolderId)return;             // already has a folder → don't create a duplicate
  if(!gReady()){                         // the Google sign-in lib loads `async defer`, so on a fresh page it often
    const n=_tries||0;                   // isn't ready the instant a launch is created → WAIT for it instead of
    if(n>40){ toast("Google Drive isn't ready yet — open the card and tap 📁 Folder to create it."); return; } // skipping (this was why the folder never got created)
    setTimeout(()=>createLaunchFolder(slug,n+1),250); return;   // retry every 250ms, up to ~10s
  }
  if(GAUTH.token&&!gHasDrive())GAUTH.token=null; // drop a stale token lacking Drive access so we re-consent
  const fname="BV-SuperPM-"+l.name; // folder named after the product, matching the Doc/Sheet naming
  toast(LANG==="zh"?"正在建立 Drive 資料夾「"+fname+"」…":"Creating Drive folder “"+fname+"”…");
  gGetToken(true).then(tok=>{
    if(!gHasDrive())throw {kind:"noscope"};
    const body={name:fname,mimeType:"application/vnd.google-apps.folder"};
    if(GOOGLE_FOLDER_ID)body.parents=[GOOGLE_FOLDER_ID]; // nest inside the shared "BV SuperPM" folder
    return fetch("https://www.googleapis.com/drive/v3/files?fields=id,webViewLink,name",{method:"POST",
      headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
      body:JSON.stringify(body)})
    .then(r=>r.json()).then(d=>{ if(!d.id)throw ((d.error&&d.error.message)||"create failed");
      // auto-share: anyone with the link can edit, like the generated Sheets/Docs
      return fetch("https://www.googleapis.com/drive/v3/files/"+d.id+"/permissions",{method:"POST",
        headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
        body:JSON.stringify({role:"writer",type:"anyone"})}).then(()=>d).catch(()=>d); });
  }).then(d=>{
    const cur=L(slug); if(!cur)return;
    cur.driveFolderId=d.id; cur.driveFolderUrl=d.webViewLink||("https://drive.google.com/open?id="+d.id);
    cur.checkins.unshift({d:today,a:actor(),txt:`Drive folder “${d.name||fname}” created in BV SuperPM (anyone-with-link can edit) — new files for this launch are saved there.`});
    log("📁 Drive folder created: "+(d.name||fname)+(GAUTH.email?(" · by "+GAUTH.email):"")); save(); render();
    toast(LANG==="zh"?"📁 Drive 資料夾「"+(d.name||fname)+"」已在 BV SuperPM 建立":"📁 Drive folder “"+(d.name||fname)+"” created in BV SuperPM");
  }).catch(err=>{
    if(err&&err.kind==="noscope"){toast("Folder not created — re-connect Google and CHECK the “Google Drive” box.");}
    else if(err&&(err.kind==="denied"||err.kind==="unconfigured")){/* sign-in cancelled — card still created locally */}
    else{toast(LANG==="zh"?"無法建立 Drive 資料夾:"+(typeof err==="string"?err:"需要登入,或被你的組織封鎖"):"Couldn't create Drive folder: "+(typeof err==="string"?err:"sign-in needed or blocked by your org"));}
  });
}

/* ----- persistence (guarded): autosave, export, reset ----- */
function snapshot(){return JSON.stringify({v:2,TEAM,PEOPLE,LAUNCHES,CAMPAIGNS,LOG,GATES,FLOW,XROUTES,TPLOV});}   // GATES/FLOW/XROUTES are ignored on load (V3 wins) — TPLOV + PEOPLE are the template/people state that survives
function save(){try{if(typeof localStorage!=="undefined")localStorage.setItem("bv-superpm",snapshot());}catch(e){} recordVersion(); fbSchedule();}
/* Keep every launch's task list in sync with the workflow template: drop any launch task
   whose title no longer exists in GATES. These orphans appear when a step is removed/renamed
   in code or in Settings → Workflow template — the change updates GATES + the code seed, but a
   board persisted to Firestore BEFORE the change still carries the old task in its tasks array,
   and onSnapshot loads that verbatim (e.g. the legacy Concept-stage "Competitor analysis" task
   owned by Catalog, removed in code by 4a062f9 but stranded in the shared board). Reconciling on
   every load heals the stored board and prevents removed steps from ever lingering again.
   Only touches LAUNCHES — CAMPAIGNS tasks are intentionally free-form and not template-bound. */
function reconcileLaunchTasks(){
  const valid=new Set(); Object.values(GATES).forEach(arr=>(arr||[]).forEach(c=>{if(c&&c.t)valid.add(c.t);}));
  if(!valid.size) return 0;                 // safety: if GATES is somehow empty, strip nothing
  let removed=0;
  LAUNCHES.forEach(l=>{ if(!Array.isArray(l.tasks))return; const n=l.tasks.length; l.tasks=l.tasks.filter(t=>t&&valid.has(t.t)); removed+=n-l.tasks.length; });
  return removed;
}
/* ---- one-time data migration: "Department requirements collected" (Product) → "Deploy marketing samples" (Logistics),
   relocated to sit right after "Mass production complete". Idempotent; also absorbs the interim "Logistics execution"
   name. The template (GATES/FLOW/XROUTES) AND every card's task copy are persisted in the board snapshot, so without
   this the saved old name would overwrite the code on load and reconcileLaunchTasks would then strip the renamed
   step from existing cards. ---- */
function migrateDeptReqToLogistics(){
  const OLDS=["Department requirements collected","Logistics execution","Send marketing samples"], NEW="Deploy marketing samples";
  const isOld=x=>x&&OLDS.indexOf(x)>=0; let changed=false;
  // GATES: rename + re-own to Logistics + reorder so it follows "Mass production complete"
  Object.keys(GATES).forEach(stage=>{ const arr=GATES[stage]; if(!Array.isArray(arr))return;
    const i=arr.findIndex(c=>c&&isOld(c.t)); if(i<0)return; const c=arr[i]; c.t=NEW; c.d="Logistics";
    arr.splice(i,1); const mp=arr.findIndex(c=>c&&c.t==="Mass production complete");
    if(mp>=0)arr.splice(mp+1,0,c); else arr.push(c); changed=true; });
  // FLOW: drop the old node from any lane, ensure one lives in the Logistics lane (before Dispatch)
  Object.keys(FLOW).forEach(d=>{ const lane=FLOW[d]; if(!Array.isArray(lane))return;
    for(let k=lane.length-1;k>=0;k--){ const n=lane[k]; if(n&&(isOld(n.l)||isOld(n.t))){ lane.splice(k,1); changed=true; } } });
  if(Array.isArray(FLOW.Logistics)&&!FLOW.Logistics.some(n=>n&&n.t===NEW)){
    const di=FLOW.Logistics.findIndex(n=>n&&n.t==="Dispatch details & tracking filed");
    const node={l:NEW,s:"Production",t:NEW}; if(di>=0)FLOW.Logistics.splice(di,0,node); else FLOW.Logistics.push(node); changed=true; }
  // XROUTES: rename the key and any [dept,label] reference to the new dept + name
  Object.keys(XROUTES).forEach(key=>{ const steps=XROUTES[key];
    if(Array.isArray(steps))steps.forEach(p=>{ if(Array.isArray(p)&&isOld(p[1])){ p[0]="Logistics"; p[1]=NEW; changed=true; } });
    OLDS.forEach(OLD=>{ if(key.endsWith("|"+OLD)){ XROUTES["Logistics|"+NEW]=XROUTES[key]; delete XROUTES[key]; changed=true; } }); });
  // every card's task copy: rename + re-own + reorder after "Mass production complete"
  LAUNCHES.forEach(l=>{ if(!Array.isArray(l.tasks))return;
    const i=l.tasks.findIndex(t=>t&&isOld(t.t)); if(i<0)return; const t=l.tasks[i]; t.t=NEW; t.d="Logistics";
    l.tasks.splice(i,1); const mp=l.tasks.findIndex(t=>t&&t.t==="Mass production complete");
    if(mp>=0)l.tasks.splice(mp+1,0,t); else l.tasks.push(t); changed=true; });
  return changed;
}
/* ---- idempotent migration: remove the duplicate Product-lane "Send samples to teams" flow node.
   This step now lives ONLY in the Logistics lane as "Deploy marketing samples" (same gate). Because
   the board snapshot persists FLOW/XROUTES, a code-only delete would be overwritten on load — so this
   strips the Product copy from any saved snapshot and cleans its XROUTES references too. ---- */
function migrateDropSamplesNode(){
  let changed=false;
  Object.keys(FLOW).forEach(d=>{ const lane=FLOW[d]; if(!Array.isArray(lane))return;
    for(let k=lane.length-1;k>=0;k--){ const n=lane[k]; if(n&&n.l==="Send samples to teams"){ lane.splice(k,1); changed=true; } } });
  if(XROUTES["Product|Send samples to teams"]){ delete XROUTES["Product|Send samples to teams"]; changed=true; }
  Object.keys(XROUTES).forEach(key=>{ const steps=XROUTES[key]; if(!Array.isArray(steps))return;
    const cleaned=steps.filter(p=>!(Array.isArray(p)&&p[0]==="Product"&&p[1]==="Send samples to teams"));
    if(cleaned.length!==steps.length){ XROUTES[key]=cleaned; changed=true; } });
  return changed;
}
/* ---- idempotent migration: "Deploy marketing samples" is the FIRST logistics action (right after
   Mass production), per the BV workflow. Moves its FLOW node to the head of the Logistics lane, its
   GATE to right after "Mass production complete", and the matching task in every card to the same
   spot. Without this the persisted snapshot's old ordering (samples after the sheet steps) would
   overwrite the code on load. Pure reorder — moves existing objects, never recreates them, so cards
   keep their status/links and the cleaned snapshot stays a write-back fixed point. ---- */
function migrateSamplesFirst(){
  const SAMP="Deploy marketing samples", MP="Mass production complete"; let changed=false;
  // FLOW: move the samples node to the front of the Logistics lane
  const lane=FLOW.Logistics;
  if(Array.isArray(lane)){ const i=lane.findIndex(n=>n&&n.t===SAMP); if(i>0){ const [n]=lane.splice(i,1); lane.unshift(n); changed=true; } }
  // GATES + every card's task copy: move samples to right after "Mass production complete"
  const afterMP=(a,key)=>{ if(!Array.isArray(a))return; const si=a.findIndex(x=>x&&x[key]===SAMP), mp=a.findIndex(x=>x&&x[key]===MP);
    if(si<0||mp<0||si===mp+1)return; const [x]=a.splice(si,1); const mp2=a.findIndex(y=>y&&y[key]===MP); a.splice(mp2+1,0,x); changed=true; };
  afterMP(GATES.Production,"t");
  LAUNCHES.forEach(l=>afterMP(l.tasks,"t"));
  return changed;
}
function applySnapshot(d){
  if(!d)return;
  TEAM.length=0;(d.TEAM||[]).forEach(x=>TEAM.push(x));
  // 負責人名單：舊快照沒有這個鍵 —— 保留程式碼側的預設，別把名單清空（清空會讓設定頁一片空白、datalist 也沒建議）
  if(Array.isArray(d.PEOPLE)&&d.PEOPLE.length){ PEOPLE.length=0; d.PEOPLE.forEach(x=>PEOPLE.push(x)); }
  LAUNCHES.length=0;(d.LAUNCHES||[]).forEach(x=>LAUNCHES.push(x));
  CAMPAIGNS.length=0;(d.CAMPAIGNS||[]).forEach(x=>CAMPAIGNS.push(x));
  if(d.LOG){LOG.length=0;d.LOG.forEach(x=>LOG.push(x));} // keep current activity log if a version snap omits it
  // The flow (GATES/FLOW/XROUTES/CROSS) is ALWAYS the code-side V3 template — we ignore any older flow
  // saved in the snapshot (this is what makes editing V3 zero-migration). Then each card is rebuilt onto
  // the V3 task set (state preserved by code; legacy 7-stage tasks drop away and their V3 node starts fresh).
  // TPLOV is the exception: the Workflow-template ownership edits are board state, so they load BEFORE the
  // derive and v3Dept() re-applies them on top of the template.
  Object.keys(TPLOV).forEach(k=>delete TPLOV[k]);
  Object.keys(d.TPLOV||{}).forEach(k=>{ if(V3MAP[k]) TPLOV[k]=d.TPLOV[k]; });
  v3Rederive();
  LAUNCHES.forEach(v3SyncTasks);
  LAUNCHES.forEach(v3Reconcile);             // heal legacy state where an upstream step was reopened but a downstream step stayed "done"
  LAUNCHES.forEach(syncDecisionReq);         // ◆ 解鎖日（SLA 起算）—— v3SyncTasks 已走過 v3Advance，這裡補的是純快照載入路徑
  LAUNCHES.forEach(syncProjected);           // 每張卡的目標日 = 依「送出日＋任務天數」推算的預計上市日
  reconcileLaunchTasks();                    // safety net (all V3 titles are in GATES, so this is a no-op now)
  applyDeptLens();                           // re-lock a signed-in non-CEO to their team once the shared TEAM email map has loaded
}
function loadSaved(){try{
  if(typeof localStorage==="undefined")return;
  const s=localStorage.getItem("bv-superpm"); if(!s)return; const d=JSON.parse(s); if(d.v!==2)return;
  applySnapshot(d);
}catch(e){}}

/* ================= VERSION HISTORY =================

         舊版分頁整份 set() 會把 rev 欄位抹掉、新瀏覽器又從 1 重編，本機高水位一比就把所有
         後續合法更新當舊資料擋掉，全隊卡黃燈。改用伺服器時間戳 updatedAt 排序：只擋
         「比這個 session 已套用過的還舊」的快照（真正的快取回放/亂序），高水位不跨 session
         持久化 —— 重開分頁一律接受雲端現況。rev 欄位保留純作 telemetry。 */
      const at=(data.updatedAt&&data.updatedAt.toMillis)?data.updatedAt.toMillis():0;
      if(at&&FB.lastAt&&at<FB.lastAt){ fbStatus(LANG==="zh"?"◍ 等待同步…":"◍ syncing…","var(--amber)"); return; }
      // dirty＝「資料真的跟共享庫不同」：render() 每次都 save()→武裝 timer，光切頁/打搜尋也會有 timer，
      // 所以必須再比內容 —— 否則「正在瀏覽的人」會拿舊記憶體 force-write 蓋掉同事剛送上來的合法更新。
      const dirty=FB.timer&&FB.lastWritten!==null&&verSnap()!==FB.lastWritten&&verSnap()!==data.state;
      if(dirty){                                               // 真的有未送出的改動（剛點的完成卡在 debounce）——先送自己的，別讓遠端洗掉
        clearTimeout(FB.timer); FB.timer=null;
        if(at)FB.lastAt=Math.max(FB.lastAt||0,at);
        recordRemoteVersion(data.updatedBy,data.state);        // 被本機蓋掉的那一版留進歷史，出事還原得回來
        if(data.updatedBy&&data.updatedBy!==actor()) toast(LANG==="zh"?"⚠️ 與 "+data.updatedBy+" 的更新同時發生 — 已以本機為準（對方版本在歷史裡）":"⚠️ concurrent update by "+data.updatedBy+" — kept local (theirs is in History)");
        fbWriteNow(true); return; }
      if(at)FB.lastAt=Math.max(FB.lastAt||0,at);
      if(data.state===verSnap()){ FB.lastWritten=data.state; return; } // already identical
      FB.applying=true;
      recordRemoteVersion(data.updatedBy,data.state);        // log who changed what, before applying
      var applyOk=true;
      try{
        try{ applySnapshot(JSON.parse(data.state)); }catch(e){ applyOk=false; FB.stale=true; }   // 例外照吞（別讓 onSnapshot 掛掉），但要記帳＋當場進 stale——fbAddVersion/fbSchedule/fbWriteNow 三道閘在任何 render/save 跑到之前就生效：半套用的 LAUNCHES 絕不能當基線、進 localStorage、推進共享 versions 或寫上雲
        var cleaned=verSnap();                               // applySnapshot may have stripped orphan tasks (reconcileLaunchTasks)
        if(applyOk){
          FB.lastWritten=cleaned; _lastVerKey=cleaned;       // 基線＝本機正規化結果（cleaned）而非遠端原文——heal 被 lastHeal 去重擋下時基線若停在 data.state，verSnap()≠lastWritten 永久成立，分頁進「永久 dirty」，之後 debounce 到期/pagehide flush/dirty 分支都會把本機這份整份蓋回雲端（第四輪推定主因之一，未實地歸因）。heal 真的有寫時 fbWriteNow 也會設 lastWritten=cleaned，兩條路一致
          try{ if(typeof localStorage!=="undefined")localStorage.setItem("bv-superpm",snapshot()); }catch(e){}
          render();                                          // render 只在套用成功時跑：失敗路徑連 render 尾端的 save()（localStorage＋recordVersion→versions 集合）都不能碰
        }
      } finally { FB.applying=false; }                       // render() 拋錯不能讓 applying 卡 true（那會讓 fbSchedule 永遠不排程＝之後的編輯全都上不了雲）
      if(!applyOk){                                          // 截斷看板收尾：stale 已在 catch 當場設好，這裡清 timer＋亮燈提示
        FB.stale=true; clearTimeout(FB.timer); FB.timer=null;
        fbStatus(LANG==="zh"?"● 套用失敗 — 請重新整理":"● apply failed — reload","var(--red)");
        toast(LANG==="zh"?"⚠️ 資料套用失敗 — 請重新整理頁面":"⚠️ snapshot apply failed — please reload"); return; }
      // self-heal 加冪等去重：正規化含 projLaunchDate 等衍生欄位（吃 today——現已隨換日就地更新，但兩分頁最多仍有 60 秒視窗各算各的）
      // 而互相「修正」——同一份 heal 內容只寫一次，斷掉無限來回寫。被擋下時留一行 console 供日後診斷（本機與雲端暫時分歧，下次編輯才收斂）。
      if(cleaned!==data.state&&cleaned!==FB.lastHeal){ FB.lastHeal=cleaned; fbWriteNow(true); }
      else if(cleaned!==data.state){ FB._healDedup=(FB._healDedup||0)+1; if(FB._healDedup===1)console.warn("[sync] heal deduped (lastHeal) — 本機正規化結果與雲端暫時分歧；之後不重複列印，計數在 FB._healDedup"); }
      if(data.updatedBy&&data.updatedBy!==actor()) toast(LANG==="zh"?"🔄 "+data.updatedBy+" 已更新看板":"🔄 "+data.updatedBy+" updated the board");
    }, err=>{ fbStatus("● offline","var(--red)"); });
    FB.versRef.orderBy("createdAt","desc").limit(120).onSnapshot(qs=>{   // shared version history (History tab)
      const arr=[]; qs.forEach(doc=>{ const x=doc.data(); x.id=doc.id; arr.push(x); });
      VERSIONS=arr; if(S.view==="versions") render();
    }, e=>{});
    FB.docRef.collection("briefs").orderBy("createdAt","desc").onSnapshot(qs=>{ BRIEFS=qs.docs.map(d=>{const x=d.data();x.id=d.id;return x;}); renderBriefs(); }, e=>{});  // shared, real-time briefs
    FB.docRef.collection("research").orderBy("createdAt","desc").onSnapshot(qs=>{ RESEARCH=qs.docs.map(d=>{const x=d.data();x.id=d.id;return x;}); renderResearch(); }, e=>{});  // 🌪 shared, real-time STORM research requests
    try{ firebase.firestore().collection("product_docs").onSnapshot(qs=>{_pdFb=qs.docs.map(d=>d.data()); if(!_pdCore.length)KNOWLEDGE.product_docs=_pdFb;}, e=>{}); }catch(_){}  // bv-superpm fallback until Core seeded
    firebase.firestore().collection("skills").onSnapshot(qs=>{KNOWLEDGE.skills=qs.docs.map(d=>Object.assign({id:d.id},d.data()));}, e=>{});  // SuperPM playbooks/skills injected into the chat prompt
  }catch(e){ fbStatus("● error","var(--red)"); }
}
function fbAddVersion(entry){ if(FB.stale)return; try{ FB.versRef.add(Object.assign({},entry,{createdAt:firebase.firestore.FieldValue.serverTimestamp()})); }catch(e){} }   // stale 分頁連版本集也不寫——舊形狀 snap 被 restore 回主文件＝回朔洗白
function fbSchedule(){ if(!FB.ready||FB.applying||FB.stale) return; clearTimeout(FB.timer); FB.timer=setTimeout(()=>{FB.timer=null;fbWriteNow(false);},700); }
function fbWriteNow(force){
  if(!FB.ready||!FB.synced||!FB.serverSeen||FB.stale) return;   // never write before the authoritative remote board has loaded (prevents the demo-seed overwrite); stale 分頁不寫主文件
  const s=verSnap(); if(!force && s===FB.lastWritten) return;
  const prev=FB.lastWritten; FB.lastWritten=s;   // 樂觀設定（去重後續排程）；失敗必須還原——否則 s===lastWritten 恆早退，這筆改動永遠不重送，下一份快照直接蓋掉＝靜默丟資料
  // rev 只在伺服器 ack 後才 +1 並落 localStorage —— 立刻 +1 的話，pagehide 那筆常常送不完，
  // 重開後本地 rev 領先實際雲端，rev 守衛會整份拒收同事的合法更新（對抗審查抓到的窗口）。
  const nrev=(FB.rev||0)+1;
  const onFail=()=>{ if(FB.lastWritten===s)FB.lastWritten=prev;   // 只在沒被更新的成功寫入蓋過時才還原
    FB._wfail=(FB._wfail||0)+1;
    if(FB._wfail>8){ fbStatus(LANG==="zh"?"● 寫入失敗 — 請重新整理":"● write failed — please reload","var(--red)"); return; }   // 永久性失敗（權限/rules 改壞/同步 throw）：退避到頂就停，別無限重排
    const d=Math.min(30000,700*Math.pow(2,FB._wfail));   // 指數退避：斷線自癒；permission-denied 也不會每 700ms 打爆
    clearTimeout(FB.retryTimer); FB.retryTimer=setTimeout(()=>{FB.retryTimer=null;fbWriteNow(force);},d);   // 獨立 retryTimer，不佔 FB.timer——FB.timer 在 dirty 判斷裡＝「有未送出的使用者改動」，借用會讓持續失敗的分頁把每份遠端快照都判成 dirty 而拒收＝孤島；pagehide flush 也只碰 FB.timer 不會誤取消退避。重試帶原本的 force：heal 那種 force 寫失敗時 s===lastWritten，用 false 重試會早退＝永不重試。代價（修法前即如此）：退避中若遠端快照先到，未送達的本機改動仍會被覆蓋
    fbStatus(LANG==="zh"?"● 寫入失敗 — 重試中":"● write failed — retrying","var(--red)"); };
  try{ FB.docRef.set({state:s,rev:nrev,appv:APPVER,updatedBy:actor(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})
    .then(()=>{ FB.rev=Math.max(FB.rev||0,nrev); FB._wfail=0; clearTimeout(FB.retryTimer); FB.retryTimer=null; })   // 寫成功就取消退避——否則 force 重試會多打一筆內容相同的冗餘全量寫
    .catch(onFail);   // set() 失敗是 rejected Promise，不是同步 throw —— 沒有 .catch 使用者零感知
  }catch(e){ onFail(); }
}
// 分頁隱藏／關閉時把 debounce 佇列裡的改動立刻送出 —— 否則「點完成→馬上關分頁」那筆永遠到不了雲端，
// 下次打開就是舊資料（使用者回報的另一種「回朔」）。pagehide 不保證送得完，visibilitychange(hidden) 通常來得及。
(function(){ const flush=()=>{ if(FB.timer){ clearTimeout(FB.timer); FB.timer=null; try{ fbWriteNow(false); }catch(e){} } };
  window.addEventListener("pagehide",flush);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flush(); });
})();

function ntfSweep(l){
  if(!FB.ready||!FB.serverSeen||FB.stale||FB.applying) return;   // FB.applying：旁觀分頁套用遠端快照時不種旗標——apply 鏈上動 ntf 會讓 cleaned≠data.state、經 self-heal 立刻整份 set()（有人打勾＝N 個旁觀分頁同時寫，任一筆晚到就 LWW 回朔）。旗標由做出改動的那個分頁負責，旁觀者靠下一份快照自然帶到
  if(NOTIFY_HOSTS.indexOf(location.hostname)<0&&!window.NTF_TEST) return;   // 本地檔案／預覽（file:// 或其他 host）一律不發也不標；NTF_TEST 只給無頭測試 driver 用
  if(!l.ntfInit){ (l.tasks||[]).forEach(t=>{ if(t.code&&!taskLocked(l,t)) t.ntf=1; }); l.ntfInit=1; return; }
  (l.tasks||[]).forEach(t=>{

    if(taskLocked(l,t)){ if(t.ntf)delete t.ntf; NTFSENT.delete(key); return; }   // 退回鎖住：清旗標，再解鎖要再通知
    if(t.ntf) return;

    if(t.st!=="o"||NTFSENT.has(key)) return;   // 已動工/卡住/完成 → 只補標不發

/* ============ PROJECTS DATA (live from Google Sheet — same source as the bv-Products portal) ============
   Read-only mirror of the portal's src/lib/sheets.ts. The portal pulls these tabs from a PUBLIC gviz CSV
   endpoint (zero auth), so this static page reads the exact same SHEET_ID directly in the browser.
   CORS is permitted on the gviz host (verified: it echoes Origin in Access-Control-Allow-Origin). */
const PROJ_SHEET_ID="1xVC0DtMZKyT1Mm5l2PPa_gFcBC3w19HgawdKLNISeCk";
let PROJECTS=[], WAITING=[], SIDETRACKS=[], PHISTORY=[], PROJ_LOADED=false, PROJ_ERR="";
function projCsvUrl(tab){return `https://docs.google.com/spreadsheets/d/${PROJ_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;}
// CSV parser with quote handling — ported verbatim from the portal's parseCSV.
function parseCSV(text){
  const rows=[]; let cur="", inQ=false, row=[];
  for(let i=0;i<text.length;i++){const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=c; }
    else if(c==='"') inQ=true;
    else if(c===',') {row.push(cur.trim());cur="";}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur.trim());cur=""; if(row.some(x=>x!==""))rows.push(row); row=[]; }
    else cur+=c;
  }
  row.push(cur.trim()); if(row.some(x=>x!==""))rows.push(row);
  return rows;
}
// Fetch a tab → array of objects keyed by header. Header keyed on first whitespace
// token (recovers schema if a header cell gets a bad paste), same as the portal.
async function fetchSheet(tab){
  let res; try{ res=await fetch(projCsvUrl(tab)); }catch(e){ console.error("[projects] fetch failed: "+tab,e); return []; }
  if(!res.ok){ console.error("[projects] sheet "+tab+" → HTTP "+res.status); return []; }
  const rows=parseCSV(await res.text());
  if(rows.length<2) return [];
  const headers=rows[0].map(h=>(h||"").split(/\s+/)[0]);
  return rows.slice(1).map(r=>{const o={}; headers.forEach((h,i)=>{ if(h)o[h]=r[i]||""; }); return o;});
}
// gviz silently falls back to the FIRST tab when a tab is missing; require key
// columns so a missing tab degrades to [] instead of importing the wrong sheet.
function hasHeaders(rows,cols){return rows.filter(r=>cols.every(h=>typeof r[h]==="string"));}
async function loadProjectsData(){
  try{
    const [p,w,s,h]=await Promise.all([fetchSheet("Projects"),fetchSheet("Waiting"),fetchSheet("SideTracks"),fetchSheet("History")]);
    PROJECTS  =hasHeaders(p,["id","name","stage_design","stage_sample","stage_pps","stage_bulk","urgency","due_date","updated_at"]);
    WAITING   =hasHeaders(w,["supplier","project_id","item"]);
    SIDETRACKS=hasHeaders(s,["label","icon","body","is_empty"]);
    PHISTORY  =hasHeaders(h,["date","project_id","name","event_type","summary"]);
    PROJ_LOADED=true; PROJ_ERR="";
    console.log(`[projects] loaded — projects:${PROJECTS.length} waiting:${WAITING.length} sidetracks:${SIDETRACKS.length} history:${PHISTORY.length}`);
  }catch(e){ PROJ_ERR=String((e&&e.message)||e); console.error("[projects] load error",e); }
  render();
}

/* 跨夜分頁殺手（2026-08-13 第三輪；2026-08-14 第四輪補洞）：today —— P5 的 sampleDate 解鎖、
   預計上市日 clamp、逾期計算全吃它。兩個開在「不同日期」的分頁對同一份資料會算出不同的鎖定與
   l.target，v3Reconcile 與 self-heal 便互相「修正」＝無聲回朔製造機，且雙方都是「新」寫入、
   時序防護攔不到。第三輪只做「切背景才重載」——筆電掀蓋分頁在前景就無限期停在舊 today，
   v3Reconcile 照樣把別人已完成的 P5 退回（第四輪成因 2）。改法：today 改 let 且只進不退（時鐘
   倒退不跟，見單調性守衛），前景分頁換日就地更新 today＋render——顯示與鎖定判斷當場正確；
   l.target 等衍生欄位等下一次 v3Advance 才對齊（刻意不在此對全卡跑 v3Advance：N 個分頁會同時寫）。
   背景/切背景仍整頁重載作保底。pagehide flush 會把佇列中的改動送出，重載不丟資料。 */
setInterval(()=>{ try{ const nt=pjToday(); if(nt===today) return;
  if(nt<today) return;   // 單調性守衛：時鐘倒退（休眠喚醒校時/改時區/VM 還原）不跟——today 變小會讓 P5 重新鎖定、v3Reconcile 把已完成的退回；ISO 日期字串可直接比大小
  if(document.hidden){ location.reload(); return; }
  if(!window._dayFlip){ window._dayFlip=1;   // 保底 listener 先掛再 render：render 拋錯不能連「切背景整頁重載」一起死
    document.addEventListener("visibilitychange",()=>{ if(document.hidden) location.reload(); }); }
  today=nt;
  const ae=document.activeElement;
  if(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.isContentEditable)){   // 整份 innerHTML 重建會清掉正在輸入的內容——等 blur 再畫；60s 兜底（元素若被別次 render 換掉，blur 監聽跟著消失）
    const tid=setTimeout(()=>{ if(document.activeElement!==ae) render(); },60000);   // 兜底只救「元素被別次 render 換掉、blur 永不觸發」——還在同一格打字的人不打斷
    ae.addEventListener("blur",()=>{clearTimeout(tid);render();},{once:true});
    toast(LANG==="zh"?"📅 日期已更換 — 離開輸入框後更新畫面":"📅 date rolled over — updates after you finish typing"); }
  else { render(); toast(LANG==="zh"?"📅 日期已更換 — 看板已更新為今天":"📅 date rolled over — board updated"); }
}catch(e){} },60000);

// V3 bilingual: EN base → ZH (auto-generated). tx() runs on ESCAPED html, so names containing "&"
// also need their &amp; form registered, else e.g. "Prototype & Delivery" won't match and stays English.
[...V3ALL,...V3PH].forEach(o=>{const e=o.en,z=o.zh;ZH[e]=z; if(e.indexOf("&")>=0)ZH[e.replace(/&/g,"&amp;")]=z;});
// 單次掃描 alternation（不是逐條循序 replace）：循序取代會把「前一條的輸出」再餵給後面的鍵 —
// identity 映射（如 "Design Team"→"Design Team"）換完字面不變，接著 \bDesign\b／\bTeam\b 照樣拆譯。
// 合成一支 regex 後，每個位置只被「最長的」鍵消費一次，替換結果不再回鍋。
const ZHRE=new RegExp(Object.keys(ZH).sort((a,b)=>b.length-a.length).map(k=>{
  const e=k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return (/^\w/.test(k)?"\\b":"")+e+(/\w$/.test(k)?"\\b":"");
}).join("|"),"g");
const zhText=s=>{if(!s.trim())return s;return s.replace(ZHRE,m=>ZH[m]!==undefined?ZH[m]:m);};
// <!--notx-->…<!--/notx--> marks language-fixed regions (V3 labels are the user's own zh/EN mix — zhText's
// sequential key replacement would mangle them, e.g. "Catalog 資料建制"→"目錄 資料建制"). No marker → behavior unchanged.
const tx=html=>{
  if(LANG==="en")return html;
  const keep=[]; html=html.replace(/<!--notx-->([\s\S]*?)<!--\/notx-->/g,(m,inner)=>{keep.push(inner);return "\u0000NTX"+(keep.length-1)+"\u0000";});
  html=html.split(/(<[^>]*>)/g).map(seg=>seg.startsWith("<")?seg:zhText(seg)).join("");
  return keep.length?html.replace(/\u0000NTX(\d+)\u0000/g,(m,i)=>keep[+i]):html;
};

/* ===== Design-language modal engine — Promise-based drop-ins for native prompt/confirm/alert.
   uiPrompt(msg,val)→Promise<string|null> · uiConfirm(msg,danger)→Promise<bool> · uiAlert(msg)→Promise<void>.
   Awaitable everywhere; enclosing fns become async. No-DOM/headless → native-default semantics. ===== */
let _uimResolve=null,_uimKeyH=null,_uimLastFocus=null;
function uiModalOpen(){return !!_uimResolve;}
function _uimEsc(v){const w=String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");return w;}
function _uimClose(val){
  const wrap=document.getElementById("uimodal");
  const r=_uimResolve;_uimResolve=null;
  if(_uimKeyH){document.removeEventListener("keydown",_uimKeyH,true);_uimKeyH=null;}
  if(wrap){wrap.classList.remove("on");wrap.setAttribute("aria-hidden","true");wrap.onclick=null;wrap.innerHTML="";}
  try{if(_uimLastFocus&&_uimLastFocus.focus)_uimLastFocus.focus();}catch(e){}
  _uimLastFocus=null;
  if(r)r(val);
}
function uiModal(o){
  o=o||{};
  const kind=o.kind||"alert",isPrompt=kind==="prompt";
  return new Promise(function(resolve){
    // headless / no-DOM (ingest, screenshot harness before render) → preserve native-default behaviour
    if(typeof document==="undefined"||!document.getElementById||!document.getElementById("uimodal")){
      resolve(isPrompt?(o.value!=null?o.value:null):(kind==="alert"?undefined:true));return;
    }
    if(_uimResolve){_uimClose(isPrompt?null:(kind==="alert"?undefined:false));}
    const wrap=document.getElementById("uimodal");
    _uimResolve=resolve;_uimLastFocus=document.activeElement;
    const zh=(typeof LANG!=="undefined"&&LANG==="zh"),danger=!!o.danger;
    const okTxt=o.okLabel||(kind==="alert"?(zh?"知道了":"OK"):isPrompt?(zh?"儲存":"Save"):(zh?"確定":"Confirm"));
    const cancelTxt=o.cancelLabel||(zh?"取消":"Cancel");
    const dotc=danger?"var(--red)":kind==="alert"?"var(--amber)":"var(--accent)";
    const title=o.title!=null?String(o.title):"",message=o.message!=null?String(o.message):"";
    const okCls=danger?"btn red":"btn uim-ok";
    let h='<div class="uimbox" role="'+(kind==="alert"?"alertdialog":"dialog")+'" aria-modal="true" aria-label="'+_uimEsc(title||message||kind)+'">';
    h+='<div class="uimhead"><span class="uimdot" style="background:'+dotc+';box-shadow:0 0 8px '+dotc+'"></span><div class="uimttl">'+_uimEsc(title||message)+'</div></div>';
    if(title&&message)h+='<div class="uimbody">'+_uimEsc(message)+'</div>';
    if(isPrompt){
      const val=o.value!=null?String(o.value):"";
      const ph=o.placeholder?' placeholder="'+_uimEsc(o.placeholder)+'"':'';
      h+=o.multiline?'<div class="uimfield"><textarea class="uimin" id="uiminput"'+ph+'>'+_uimEsc(val)+'</textarea></div>'
                    :'<div class="uimfield"><input class="uimin" id="uiminput" type="text" value="'+_uimEsc(val)+'"'+ph+'></div>';
    }
    h+='<div class="uimacts">';
    if(kind!=="alert")h+='<button type="button" class="btn ghost uim-cancel">'+_uimEsc(cancelTxt)+'</button>';
    h+='<button type="button" class="'+okCls+'">'+_uimEsc(okTxt)+'</button></div></div>';
    wrap.innerHTML=h;wrap.classList.add("on");wrap.setAttribute("aria-hidden","false");
    const box=wrap.querySelector(".uimbox"),input=wrap.querySelector("#uiminput");
    const okBtn=wrap.querySelector(".uim-ok, .btn.red"),cancelBtn=wrap.querySelector(".uim-cancel");
    function done(ok){
      let out;
      if(kind==="alert")out=undefined;
      else if(isPrompt)out=ok?(input?input.value:""):null;
      else out=!!ok;
      _uimClose(out);
    }
    if(okBtn)okBtn.onclick=function(){done(true);};
    if(cancelBtn)cancelBtn.onclick=function(){done(false);};
    wrap.onclick=function(e){if(e.target===wrap)done(false);};
    _uimKeyH=function(e){
      if(e.key==="Escape"){e.preventDefault();e.stopImmediatePropagation();done(false);}
      else if(e.key==="Enter"&&!(isPrompt&&o.multiline)){
        if(document.activeElement&&document.activeElement.tagName==="TEXTAREA")return;
        e.preventDefault();e.stopImmediatePropagation();
        const af=document.activeElement;                       // Enter respects the focused button (danger dialogs focus Cancel → Enter cancels, not deletes)
        if(af&&(af===okBtn||af===cancelBtn))af.click(); else done(true);
      }else if(e.key==="Tab"){
        const f=box.querySelectorAll("button,input,textarea,select,[tabindex]");
        if(!f.length)return;const first=f[0],last=f[f.length-1];
        if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
        else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
      }
    };
    document.addEventListener("keydown",_uimKeyH,true);
    setTimeout(function(){try{if(input){input.focus();if(input.select)input.select();}else if(danger&&cancelBtn){cancelBtn.focus();}else if(okBtn){okBtn.focus();}}catch(e){}},30);
  });
}
// native-signature async wrappers — near drop-in replacements
function uiPrompt(message,value,opts){opts=opts||{};return uiModal({kind:"prompt",title:message,value:value,placeholder:opts.placeholder,multiline:opts.multiline,okLabel:opts.okLabel});}
function uiConfirm(message,danger,opts){opts=opts||{};const parts=String(message==null?"":message).split(/\n\n+/);return uiModal({kind:"confirm",title:opts.title!=null?opts.title:parts[0],message:opts.message!=null?opts.message:parts.slice(1).join("\n\n"),danger:!!danger,okLabel:opts.okLabel,cancelLabel:opts.cancelLabel});}
function uiAlert(message,opts){opts=opts||{};const parts=String(message==null?"":message).split(/\n\n+/);return uiModal({kind:"alert",title:parts[0],message:parts.slice(1).join("\n\n"),okLabel:opts.okLabel});}
